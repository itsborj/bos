<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOS — Gate 2 Stream</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--surface:#fff;--border:#e5e3df;
  --text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;
  --green:#1a4731;--green-bg:#f0fdf4;--green-border:#bbf7d0;--green-mid:#166534;
  --amber:#d97706;--amber-bg:#fef3c7;
  --red:#dc2626;--red-bg:#fef2f2;
  --blue-bg:#eff6ff;--blue:#1d4ed8;
  --ok:#15803d;--ok-bg:#dcfce7;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}

/* ── Shell ── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;max-width:1100px;width:100%;margin:0 auto}
@media(min-width:1100px){.shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.topbar{height:48px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 16px;flex-shrink:0;z-index:10}
.topbar-logo{font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em}
.topbar-brand{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--green-bg);color:var(--green);font-weight:600;border:1px solid var(--green-border)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.page-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.page-scroll::-webkit-scrollbar{display:none}

/* ── Tab bar ── */
.bottom-tabs{height:68px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 16px 8px;z-index:10}
.tab-group{display:inline-flex;align-items:stretch;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06)}
.tab-btn{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);font-family:inherit;padding:9px 22px;border-radius:12px;transition:all .15s}
.tab-btn:hover{color:var(--text);background:var(--bg)}
.tab-btn.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(26,71,49,.25)}
.tab-badge{background:var(--amber);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;padding:6px 13px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;border:1px solid transparent;font-weight:500;transition:all .1s}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:var(--green-mid)}
.btn-ghost{background:none;border-color:var(--border);color:var(--text2)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-accent{background:none;border-color:var(--green-border);color:var(--green)}
.btn-accent:hover{background:var(--green-bg)}
.btn-send{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Stream ── */
.stream-wrap{padding:20px 16px;max-width:480px;margin:0 auto}
.stream-kicker{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.stream-title{font-size:20px;font-weight:700;margin-bottom:4px}
.stream-sub{font-size:13px;color:var(--text2);margin-bottom:14px}
.obj-anchor{background:var(--surface);border:1px solid var(--green-border);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.obj-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.obj-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--green)}
.obj-text{font-size:12px;color:var(--text);font-weight:500}
.obj-meta{font-size:10px;color:var(--text2);margin-left:auto;white-space:nowrap}

/* ── Cards ── */
.g2card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.g2card.featured{border-color:var(--green);border-left:3px solid var(--green)}
.g2top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.g2type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:5px}
.g2type.decision_brief{background:var(--amber-bg);color:#92400e}
.g2type.pending_artifact{background:var(--blue-bg);color:var(--blue)}
.g2type.outcome{background:var(--ok-bg);color:var(--ok)}
.g2type.setup_blocker{background:var(--red-bg);color:var(--red)}
.g2conf{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;margin-left:auto}
.g2conf.amber{background:var(--amber-bg);color:#92400e}
.g2conf.green{background:var(--ok-bg);color:var(--ok)}
.g2obj{font-size:11px;color:var(--text2);font-weight:500;margin-bottom:2px}
.g2brand{font-size:10px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.g2why{font-size:13px;line-height:1.5;margin-bottom:10px}
.g2stats{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.g2stat{font-size:13px;font-weight:700}
.g2stat span{font-size:10px;font-weight:500;color:var(--text2);display:block}
.g2ev{margin-bottom:10px}
.g2ev-item{font-size:11px;color:var(--text2);padding:2px 0;line-height:1.4}
.g2ev-item::before{content:'· ';color:var(--text3)}
.g2mem{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.g2mem-tag{font-size:10px;font-family:'SF Mono','Fira Mono',monospace;background:var(--bg);color:var(--text2);border:1px solid var(--border);padding:2px 7px;border-radius:4px}
.g2rec{background:var(--green-bg);border:1px solid var(--green-border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--green-mid);line-height:1.45;margin-bottom:8px}
.g2rec b{font-weight:700;margin-right:4px}
.g2boundary{font-size:11px;color:var(--text3);margin-bottom:8px;font-style:italic}
.readiness-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.readiness-field{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px}
.readiness-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:3px}
.readiness-body{font-size:12px;line-height:1.45;color:var(--text)}
.artifact-preview{border:1px dashed var(--border);border-radius:8px;padding:9px 10px;margin-bottom:10px;background:#fbfbfa}
.artifact-preview summary{cursor:pointer;list-style:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);display:flex;align-items:center;justify-content:space-between}
.artifact-preview summary::-webkit-details-marker{display:none}
.artifact-preview summary::after{content:'secondary';font-size:9px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text3)}
.artifact-preview[open] summary{margin-bottom:7px}
.preview-row{font-size:11px;line-height:1.45;color:var(--text2);padding:4px 0;border-top:1px solid var(--border)}
.preview-row:first-of-type{border-top:none}
.preview-row b{color:var(--text);font-weight:600}
.g2src-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.g2src{font-size:10px;font-family:'SF Mono','Fira Mono',monospace;background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:4px;color:var(--text2)}
.g2actions{display:flex;gap:6px;flex-wrap:wrap}

/* ── CMO Split ── */
.split-shell{display:flex;height:100%;overflow:hidden}
.split-chat{flex:0 0 420px;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
.split-right{flex:1;overflow-y:auto;background:var(--surface);padding:20px;scrollbar-width:none}
.split-right::-webkit-scrollbar{display:none}
@media(max-width:768px){
  .split-shell{flex-direction:column}
  .split-chat{flex:0 0 58%;min-height:0;border-right:none;border-bottom:1px solid var(--border)}
  .split-right{display:block;flex:1;min-height:0;padding:16px;overflow-y:auto}
}

/* ── CMO chat ── */
.cmo-msgs{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}
.cmo-msgs::-webkit-scrollbar{display:none}
.cmo-msgs-body{display:flex;flex-direction:column;gap:14px}
.cmo-ctx{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:4px}
.msg-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.msg-ai{background:var(--surface);border:1px solid var(--border);border-radius:10px;border-top-left-radius:2px;padding:10px 13px;font-size:13px;line-height:1.55;max-width:92%}
.msg-user{background:var(--green);color:#fff;border-radius:10px;border-top-right-radius:2px;padding:9px 13px;font-size:13px;line-height:1.5;align-self:flex-end;max-width:84%}
.cmo-chips{display:flex;gap:7px;flex-wrap:wrap}
.cmo-hb{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.cmo-hb-header{background:var(--green);color:#fff;padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cmo-hb-header-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.8;margin-bottom:3px}
.cmo-hb-header-obj{font-size:13px;font-weight:700;line-height:1.3}
.cmo-hb-header-meta{font-size:10px;opacity:.7;margin-top:4px}
.cmo-hb-header-ts{font-size:10px;opacity:.6;white-space:nowrap;margin-top:2px;font-family:'SF Mono','Fira Mono',monospace}
.cmo-hb-sections{padding:0}
.cmo-hb-section{padding:11px 14px;border-bottom:1px solid var(--border)}
.cmo-hb-section:last-child{border-bottom:none}
.cmo-hb-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px}
.cmo-hb-body{font-size:12px;line-height:1.55;color:var(--text)}
.cmo-hb-action{background:var(--green-bg);border-top:1px solid var(--green-border)}
.cmo-hb-action .cmo-hb-label{color:var(--green)}
.cmo-hb-action .cmo-hb-body{color:var(--green-mid);font-weight:500}
.cmo-hb-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
.cmo-hb-pass{font-size:10px;color:var(--text3);font-style:italic}
.btn-hb-copy{font-size:11px;font-weight:600;background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text2);font-family:inherit}
.btn-hb-copy:hover{background:var(--surface);color:var(--text)}
.cmo-input-wrap{flex-shrink:0;border-top:1px solid var(--border);padding:10px 16px}
.cmo-composer{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.cmo-ta{width:100%;border:none;background:none;font-family:inherit;font-size:13px;resize:none;outline:none;color:var(--text)}
.cmo-composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.cmo-hint{font-size:10px;color:var(--text3)}

/* ── Outcome recording form (inline in CMO chat) ── */
.outcome-form{background:var(--surface);border:1px solid var(--green-border);border-radius:10px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:12px}
.outcome-form-obj{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.outcome-form-obj-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.outcome-form-obj-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--green)}
.outcome-form-obj-name{font-size:12px;color:var(--text);font-weight:500;margin-left:2px}
.outcome-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.outcome-form-notes{grid-column:1/-1}
.outcome-form-notes textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;resize:none}
.outcome-form-notes textarea:focus{border-color:var(--green)}
.outcome-form-actions{display:flex;gap:7px;align-items:center;padding-top:4px}
.btn-outcome-submit{background:var(--green);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-outcome-submit:hover{opacity:.88}
.btn-outcome-cancel{background:none;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-outcome-cancel:hover{background:var(--bg)}
.outcome-confirm{background:var(--green-bg);border:1px solid var(--green-border);border-radius:10px;padding:14px;margin-top:10px;display:flex;align-items:flex-start;gap:10px}
.outcome-confirm-icon{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:1px}
.outcome-confirm-title{font-size:12px;font-weight:700;color:var(--green-mid);margin-bottom:7px}
.outcome-confirm-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.outcome-confirm-next{font-size:11px;color:var(--green-mid);line-height:1.45}

/* ── Right panel card detail ── */
.rp-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.rp-title{font-size:15px;font-weight:700}
.rp-meta{font-size:11px;color:var(--text2);margin-top:3px}
.rp-section{margin-bottom:16px}
.rp-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin-bottom:6px}
.rp-body{font-size:13px;line-height:1.55;color:var(--text)}
.rp-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}

/* ── Full window overlay (inside shell, tabs stay visible) ── */
.fullwin{position:absolute;top:48px;left:0;right:0;bottom:68px;background:var(--bg);z-index:50;display:none;flex-direction:column}
.fullwin.open{display:flex}
.fullwin-topbar{height:48px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0}
.fullwin-back{font-size:13px;color:var(--text2);cursor:pointer;background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-family:inherit;display:flex;align-items:center;gap:5px}
.fullwin-back:hover{background:var(--bg);color:var(--text)}
.fullwin-title{font-size:13px;font-weight:600;color:var(--text)}
.fullwin-body{flex:1;overflow-y:auto;padding:24px;max-width:720px;margin:0 auto;width:100%;scrollbar-width:none}
.fullwin-body::-webkit-scrollbar{display:none}

/* ── Admin ── */
.admin-wrap{padding:20px 16px;max-width:480px;margin:0 auto}
/* ── Admin layout ── */
.admin-layout{display:flex;height:100%;overflow:hidden}
.admin-nav{width:196px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);padding:20px 0;overflow-y:auto;scrollbar-width:none}
.admin-nav::-webkit-scrollbar{display:none}
.admin-nav-wordmark{font-size:12px;font-weight:700;color:var(--text);padding:0 16px 18px;letter-spacing:-.01em}
.admin-nav-group{margin-bottom:6px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.admin-nav-group:last-child{border-bottom:none}
.admin-nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:8px 16px 4px}
.admin-nav-item{display:block;width:100%;text-align:left;padding:7px 16px;font-size:13px;font-weight:500;color:var(--text2);background:none;border:none;border-left:2px solid transparent;cursor:pointer;font-family:inherit;transition:all .1s;line-height:1.3}
.admin-nav-item:hover{color:var(--text);background:var(--bg)}
.admin-nav-item.active{color:var(--green);background:var(--green-bg);border-left-color:var(--green);font-weight:600}
.admin-nav-item.parked{color:var(--text3);font-style:italic;cursor:default;opacity:.7}
.admin-nav-item.parked:hover{background:none;color:var(--text3)}
.admin-content{flex:1;overflow-y:auto;scrollbar-width:none;padding:32px 36px}
.admin-content::-webkit-scrollbar{display:none}
.admin-section-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px}
.admin-section-sub{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.5}
.settings-group{margin-bottom:32px}
.settings-group-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:0}
.settings-row{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-info{flex:1;min-width:0}
.settings-row-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.settings-row-desc{font-size:12px;color:var(--text2);line-height:1.4}
.settings-row-status{display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-dot.green{background:var(--ok)}
.s-dot.amber{background:var(--amber)}
.s-dot.grey{background:var(--text3)}
.s-text{font-size:12px;color:var(--text2)}
.s-text.amber{color:var(--amber)}
.settings-row-action{flex-shrink:0}
.action-link{font-size:12px;color:var(--green);font-weight:500;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.action-link:hover{text-decoration:underline}
.hb-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.hb-row{padding:14px 18px;border-bottom:1px solid var(--border)}
.hb-row:last-child{border-bottom:none}
.hb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:5px}
.hb-body{font-size:13px;line-height:1.6;color:var(--text2)}
@media(max-width:900px){.admin-nav{display:none}.admin-content{padding:20px 16px}}

/* ── Flow ── */
.flow-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.flow-scroll::-webkit-scrollbar{display:none}
.flow-col{max-width:520px;margin:0 auto;padding:24px 16px 32px}
.flow-title{font-size:18px;font-weight:700;margin-bottom:4px}
.flow-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.flow-legend{display:flex;gap:16px;margin-bottom:24px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.legend-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.flow-node{display:flex;gap:0;margin-bottom:0}
.flow-spine{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0}
.flow-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;margin-top:2px}
.flow-dot.operator{background:var(--green)}
.flow-dot.system{background:var(--text3)}
.flow-line{width:2px;background:var(--border);flex:1;min-height:16px;margin:4px 0}
.flow-body{flex:1;padding:0 0 24px 12px}
.flow-node-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px;margin-top:3px}
.flow-node-sub{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:8px}
.flow-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.flow-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.flow-tag-op{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.flow-tag-sys{background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.flow-tag-state{background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe}
.flow-io{font-size:11px;color:var(--text2);line-height:1.7;background:var(--bg);border-left:2px solid var(--border);padding:6px 10px;border-radius:0 4px 4px 0}
.flow-io-key{color:var(--text3)}
.flow-io-val{color:var(--text)}

/* ── signal_update / council_brief ── */

.g2question-item{font-size:11px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border);line-height:1.4}

/* ── Watchpoint admin ── */
.wp-state{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.wp-state.watching{background:#eff6ff;color:#1d4ed8}

.wp-field{display:flex;flex-direction:column;gap:4px}
.wp-field.full{grid-column:1/-1}
.wp-field label{font-size:11px;font-weight:600;color:var(--text2)}
.wp-field select,.wp-field input[type="number"],.wp-field input[type="text"]{border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none}

.cs-settle{background:#081510;border:1px solid #173d1e;border-radius:6px;padding:10px 12px;margin:20px 0 14px;font-size:9.5px;font-weight:700;color:#4ade80;text-transform:uppercase;letter-spacing:.08em}

.sig-dissent{color:#f87171;background:rgba(248,113,113,.08)}

/* ── Card HTML builder ── */
function cardHTML(c) {
  if (c.type === 'council_session') return councilSessionCardHTML(c);
  const stats = c.stats
    ? `<div class="g2stats">${c.stats.map(s=>`<div class="g2stat">${s.v}<span>${s.l}</span></div>`).join('')}</div>`
    : '';
  const memtags = c.memtags
    ? `<div class="g2mem">${c.memtags.map(t=>`<span class="g2mem-tag">${t}</span>`).join('')}</div>`
    : '';
  const ev = c.evidence.map(e=>`<div class="g2ev-item">${e}</div>`).join('');
  const rec = c.rec ? `<div class="g2rec"><b>Next —</b>${c.rec}</div>` : '';
  const boundary = c.boundary ? `<div class="g2boundary">${c.boundary}</div>` : '';
  const preview = artifactPreviewHTML(c);
  const srcs = c.sources.map(s=>`<span class="g2src">${s}</span>`).join('');

    ? `<span class="g2conf ${c.conf.color}">${c.conf.label}</span>` : '';

    return `<button class="btn ${cls}" data-action="${a}" data-id="${c.id}">${a}</button>`;

/* ── Card section helpers ── */
function artifactPreviewHTML(c, expanded=false) {
  if (!c.platformPreview) return '';
  const rows = c.platformPreview.rows.map(([k,v])=>`<div class="preview-row"><b>${k}</b><br>${v}</div>`).join('');
  return `<details class="artifact-preview"${expanded ? ' open' : ''}>
    <summary>${c.platformPreview.label}</summary>
    ${rows}
  </details>`;
}

function watchpointHTML(c) {
  if (!c.watchpoint) return '';
  const pct = Math.round(c.watchpoint.current / c.watchpoint.threshold * 100);
  const headroom = Math.round((1 - c.watchpoint.current / c.watchpoint.threshold) * 100);
  return `<div class="g2watch">
    <div class="g2watch-header"><span>${c.watchpoint.metric}</span><span>${c.watchpoint.current} of ${c.watchpoint.threshold} threshold</span></div>
    <div class="g2watch-track"><div class="g2watch-fill" style="width:${pct}%"></div></div>
    <div class="g2watch-sub">${headroom}% below fatigue threshold · watching</div>
  </div>`;
}

      </div>

  const syn = `<div class="g2synthesis"><b>Synthesis — </b>${c.synthesis}</div>`;

          <span class="seat-badge">${s.id}</span>
          <span class="${isActive?'chip-active':'chip-vacant'}" id="chip-${s.cid}">${isActive?'ACTIVE':'VACANT'}</span>
        </div>
        <div class="seat-field">
          <span class="seat-field-lbl">Display Name</span>
          <input class="seat-input" value="${s.name}" placeholder="Recruit a council member" />
        </div>
        <div class="seat-field">
          <span class="seat-field-lbl">Model</span>
          <select class="seat-select">${selOpts}</select>
        </div>
        <div class="seat-field">
          <button class="ideology-toggle" onclick="toggleIdeology(this)">
            <span>Ideology</span>
            <span class="ideology-chevron">&#8963;</span>
          </button>
          <textarea class="ideology-area" placeholder="Define this member's strategic worldview, priors, and how they frame decisions.">${s.ideology}</textarea>
        </div>
        <div class="seat-footer">
          <div class="status-toggle">
            <button class="stgl-btn${!isActive?' sel-vacant':''}" onclick="toggleStatus(this,'${s.cid}','vacant')">Vacant</button>
            <button class="stgl-btn${isActive?' sel-active':''}" onclick="toggleStatus(this,'${s.cid}','active')">Active</button>
          </div>
          <button class="btn-save" onclick="saveSeat(this)">Save</button>
        </div>
      </div>`;
    }).join('');
    return `
      <div class="admin-section-title">Council Seats</div>
      <div class="admin-section-sub">5 seats · assign an LLM and ideology to each. Active seats are called when @council is invoked in CMO. Vacant seats are skipped.</div>
      <div class="settings-group">
        <div class="settings-group-label" style="display:flex;align-items:center;justify-content:space-between;padding-bottom:10px">
          <span>Seats</span>
          <span style="font-size:11px;color:var(--text3);font-family:'SF Mono','Fira Mono',monospace">2 active · 3 vacant</span>
        </div>
        ${seatCards}
      </div>`;
  }

  if (adminSection === 'flow') {
    return `
      <div class="admin-section-title">Loop Flow</div>
      <div class="admin-section-sub">Eight steps from first signal to compounding memory. Use this to trace how a decision moved through the system.</div>
      ${flowNodesHTML()}`;
  }

  if (adminSection === 'parked') {
    const rows = [
      { name:'CRM connector', desc:'HubSpot, Salesforce — prospect list sync and auto-refresh' },
      { name:'Additional channels', desc:'LinkedIn, Slack outreach — multi-channel sequences' },
      { name:'Watchpoints automation', desc:'Automated signal detection from connected data sources — requires live connectors beyond Gmail' },
      { name:'CMO Council', desc:'Multi-model deliberation layer — planned for Gate 3' },
    ].map(r=>`
      <div class="settings-row" style="opacity:.45">
        <div class="settings-row-info">
          <div class="settings-row-name">${r.name}</div>
          <div class="settings-row-desc">${r.desc}</div>
        </div>
        <div class="settings-row-status">
          <div class="s-dot grey"></div>
          <span class="s-text">Gate 3</span>
        </div>
      </div>`).join('');
    return `
      <div class="admin-section-title">Parked · Gate 3</div>
      <div class="admin-section-sub">Not in scope for Gate 2. Enabled after the Gmail-only loop proves economic movement.</div>
      <div class="settings-group">
        <div class="settings-group-label">Planned capabilities</div>
        ${rows}
      </div>`;
  }
  return '';
}

function renderAdmin() {
  return `<div class="admin-layout">
    ${adminNav()}
    <div class="admin-content" id="admin-content">${adminContentHTML()}</div>
  </div>`;
}

function flowNodesHTML() {
  const steps = [
    { role:'system', title:'Stream: decision_brief appears',
      sub:'BOS reads Gmail, matches April memory, ranks card as highest urgency. Confidence: directional (0.71). Card surfaces with evidence, recommended action, and approval boundary.',
      tags:['system','state: pending operator review'],
      io:[['inputs','Gmail replies · April memory · 47 contacts identified'],['output','decision_brief card ranked #1 in Stream']] },
    { role:'operator', title:'Operator taps "Ask CMO"',
      sub:'From the decision_brief card. CMO opens with context pre-loaded: brand, objective, card type. Not a blank chatbot — the brief is already there.',
      tags:['operator','state: CMO surface open'],
      io:[['context loaded','Klaroha · $40k pipeline · decision_brief'],['CMO opens with','judgment summary, not blank prompt']] },
    { role:'operator', title:'Operator reviews brief, taps "Approve"',
      sub:'Operator reviews the pending_artifact (sequence v2). Decision: approve. BOS receives the approval signal — this is the only gate before execution.',
      tags:['operator','state: artifact approved'],
      io:[['artifact','sequence v2 · status: approved'],['boundary','BOS cannot send without this step']] },
    { role:'system', title:'BOS queues Gmail send',
      sub:'Card moves from pending to queued. BOS schedules delivery for the Thursday window. No further operator action needed until replies arrive.',
      tags:['system','state: queued for send'],
      io:[['action','47 emails queued · Thursday window · Gmail connector'],['operator required','none until replies arrive']] },
    { role:'system', title:'Gmail sends · replies come in',
      sub:'BOS monitors the Gmail thread. Replies are read, reply rate is tracked, patterns are noted. Memory writing is deferred until operator confirms outcome.',
      tags:['system','state: observing'],
      io:[['monitoring','Gmail replies · reply timing patterns'],['memory writing','deferred until operator confirms']] },
    { role:'operator', title:'Operator records outcome in CMO or Stream',
      sub:'After calls conclude, the operator records what happened. BOS uses this to write memory — outcome records are the basis for every future recommendation.',
      tags:['operator','state: outcome recording'],
      io:[['operator inputs','calls booked · deal status · notes'],['BOS writes','outcome record to memory']] },
    { role:'system', title:'Stream: outcome card appears · memory updated',
      sub:'Campaign closes. Outcome card shows results and lists what was written to memory. Operator can dismiss or ask CMO for interpretation.',
      tags:['system','state: memory written'],
      io:[['written','case_study_angle · email_2_response · no_show_pattern'],['card type','outcome · dismissable']] },
    { role:'system', title:'Next decision_brief is better', last:true,
      sub:'The next recommendation references both April and May data. Confidence increases. Sequence v3 can be proposed with stronger evidence. The loop compounds.',
      tags:['system','state: loop complete · memory compounds'],
      io:[['evidence base','April + May outcome records'],['confidence','directional → known as data accumulates'],['loop','observe → interpret → remember → recommend → execute']] },
  ];

  const tagClass = t => t==='operator' ? 'flow-tag-op' : t.startsWith('state') ? 'flow-tag-state' : 'flow-tag-sys';

  const nodes = steps.map(s=>`
    <div class="flow-node">
      <div class="flow-spine">
        <div class="flow-dot ${s.role}">${s.role==='operator'?'O':'S'}</div>
        ${s.last ? '' : '<div class="flow-line"></div>'}
      </div>
      <div class="flow-body">
        <div class="flow-node-title">${s.title}</div>
        <div class="flow-node-sub">${s.sub}</div>
        <div class="flow-tags">${s.tags.map(t=>`<span class="flow-tag ${tagClass(t)}">${t}</span>`).join('')}</div>
        <div class="flow-io">${s.io.map(([k,v])=>`<span class="flow-io-key">${k}: </span><span class="flow-io-val">${v}</span>`).join('<br>')}</div>
      </div>
    </div>`).join('');

  return `
    <div class="flow-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)">O</div> Operator action</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--text3)">S</div> System action</div>
    </div>
    ${nodes}`;
}

/* ── Router ── */
function setPage(p) {
  activePage = p;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.page===p);
  });
  const area = document.getElementById('page-area');
  if (p==='stream') {
    area.innerHTML = renderStream();
  } else if (p==='cmo') {
    area.innerHTML = renderCMO();
    wireCMO();
  } else if (p==='admin') {
    area.innerHTML = renderAdmin();
  }
  updateBadge();
}

function updateBadge() {
  const needs = cards.filter(c=>!c._done&&c.type!=='outcome'&&c.type!=='signal_update').length;
  const b = document.getElementById('tab-badge');
  if (b) { b.textContent=needs; b.style.display=needs?'':'none'; }
}

        <div class="outcome-form-obj-dot"></div>
        <span class="outcome-form-obj-label">Objective</span>
        <span class="outcome-form-obj-name">Generate $40k pipeline from dormant prospects · Q2</span>
      </div>
      <div class="outcome-form-grid">
        <div class="wp-field">

function outcomeConfirmHTML(type, value) {
  const typeLabels = {
    reply_received:'reply_received', meeting_booked:'meeting_booked',
    deal_opened:'deal_opened', no_response:'no_response',
    unsubscribed:'unsubscribed', other:'outcome_recorded'
  };
  const tag = typeLabels[type] || 'outcome_recorded';
  const displayVal = value ? value : 'recorded';
  return `
    <div class="outcome-confirm">
      <div class="outcome-confirm-icon">✓</div>
      <div>
        <div class="outcome-confirm-title">Outcome recorded · Memory updated</div>
        <div class="outcome-confirm-tags">
          <span class="g2mem-tag">${tag}</span>
          <span class="g2mem-tag">$40k pipeline · Q2</span>
          <span class="g2mem-tag">${displayVal}</span>
          <span class="g2mem-tag">case_study_angle</span>
        </div>
        <div class="outcome-confirm-next">Next recommendation will incorporate this result. Check Stream for an updated decision brief.</div>
      </div>
    </div>`;
}

function copyHandoffBrief(btn) {
  const hb = btn.closest('.cmo-hb');
  if (!hb) return;
  const lines = [];
  hb.querySelectorAll('.cmo-hb-section').forEach(s => {
    const label = s.querySelector('.cmo-hb-label')?.textContent || '';
    const body  = s.querySelector('.cmo-hb-body')?.textContent || '';
    lines.push(label.toUpperCase() + '\n' + body);
  });
  const text = 'HANDOFF BRIEF — Klaroha — Generate $40k pipeline\n\n' + lines.join('\n\n');
  navigator.clipboard?.writeText(text).then(() => { btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = 'Copy brief', 2000); });
}

function submitOutcomeForm() {
  const type = document.getElementById('of-type')?.value || '';
  const value = document.getElementById('of-value')?.value?.trim() || '';
  const r = document.getElementById('chip-reply');
  if (r) r.innerHTML = r.innerHTML.replace(/<div class="outcome-form"[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/, '') + outcomeConfirmHTML(type, value);
  // Replace the form node directly
  const form = document.getElementById('outcome-form');
  if (form) form.outerHTML = outcomeConfirmHTML(type, value);
}

function cancelOutcomeForm() {
  const form = document.getElementById('outcome-form');
  if (form) form.remove();
}

function openCMOFromCard(card, actionLabel='ask CMO') {
  selectedCard = card;
  cmoContextNote = `Opened from Stream via ${actionLabel} on ${TYPE_LABELS[card.type]}`;
  closeFullWin();
  setPage('cmo');
}

function openOutcomeFromCard(card) {
  openCMOFromCard(card, 'record outcome');
  const r = document.getElementById('chip-reply');
  if (r) r.innerHTML = `<div>
    <div class="msg-label" style="margin-top:10px">CMO</div>
    <div class="msg-ai">Record the outcome against this objective. BOS will write memory and improve the next recommendation.</div>
    ${outcomeFormHTML()}
  </div>`;
}

function wireCMO() {
  document.querySelectorAll('[data-chip]').forEach(btn => {
    btn.addEventListener('click', function() {
      const chip = this.dataset.chip;
      const replies = {
        why:'The case study angle works because it leads with a specific, credible outcome — 34% CAC reduction — rather than a feature list. In April, this framing made the email feel like a peer referral rather than a pitch. It outperformed the feature-benefit version 21% to 8%.',
        after:'Once approved, BOS queues the sequence for Tuesday 9 AM send via Gmail. Replies are monitored automatically. High-intent replies surface back here as pending artifacts for follow-up drafts. No-shows get flagged for a different sequence timing.',
        outcome:'Tell me what happened and I will record it. Fill in the outcome below — BOS will write memory and adjust the next recommendation.',
        handoff:'Here is the current-state handoff brief. A new CMO should be able to become operational from this without asking you to reconstruct context.',
        'cb-questions':'The council flagged 4 questions before BOS can proceed: (1) Is $6.5k within Q2 budget authority, or does this require escalation? (2) Should creative refresh happen before or concurrent with the budget increase? (3) Is the Q2 pipeline target still correctly scoped for this channel? (4) If Gmail hits fatigue ceiling, is a second channel ready to activate? Record your answers — BOS will update the objective plan.',
        'cb-dissent':'Two seats dissented. Creative: "Budget increase is viable only if the sequence is refreshed first — fatigue is measurable and rising." Devil\'s Advocate: "Budget was dismissed twice. Is the objective correctly scoped, or is the channel wrong for this segment?" The other three seats support the $6.5k increase.',
        'cb-donot':'Do not scale send volume before refreshing the creative sequence. Do not dismiss the budget topic a third time without recording your rationale — BOS will flag a third dismissal as a decision-not-to-act event.',
        'cs-orders': selectedCard.orders ? `Marching orders from this session: ${selectedCard.orders.map((o,i)=>`(${i+1}) ${o}`).join(' · ')}` : 'No marching orders recorded for this session.',
        'cs-parked': selectedCard.parked ? `Parked for next session: ${selectedCard.parked.map(p=>p.text).join(' · ')}` : 'Nothing explicitly parked.',
        'cs-dissent':'The council reached alignment — all seats settled. No formal dissent was recorded. The Devil\'s Advocate raised the channel-fit question but withdrew after the Strategist and Analyst presented the pipeline model.',
      };
      const r = document.getElementById('chip-reply');
      if (!r) return;
      if (chip === 'outcome') {
        r.innerHTML = `<div>
          <div class="msg-label" style="margin-top:10px">CMO</div>
          <div class="msg-ai">${replies.outcome}</div>
          ${outcomeFormHTML()}
        </div>`;
      } else if (chip === 'handoff') {
        r.innerHTML = `<div>
          <div class="msg-label" style="margin-top:10px">CMO · handoff brief</div>
          <div class="msg-ai">${replies.handoff}</div>
          ${handoffBriefHTML()}
        </div>`;
      } else {
        r.innerHTML = `<div><div class="msg-label" style="margin-top:10px">CMO</div><div class="msg-ai">${replies[chip]}</div></div>`;
      }
    });
  });
}

function openFullWin(c) {
  document.getElementById('fullwin-title').textContent = TYPE_LABELS[c.type] + ' — ' + c.brand;
  document.getElementById('fullwin-body').innerHTML = fullWinHTML(c);
  document.getElementById('fullwin').classList.add('open');
}

function closeFullWin() {
  document.getElementById('fullwin').classList.remove('open');
}

/* ── Events ── */
document.getElementById('fullwin-close').addEventListener('click', closeFullWin);

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tab-btn[data-page]');
  if (tabBtn) {
    closeFullWin();
    setPage(tabBtn.dataset.page);
    return;
  }

  const wpBtn = e.target.closest('[data-wp-action]');
  if (wpBtn) {
    const a = wpBtn.dataset.wpAction;
    if (a === 'add')    { wpFormOpen = true;  wpEditId = null; }
    if (a === 'edit')   { wpFormOpen = true;  wpEditId = wpBtn.dataset.wpId; }
    if (a === 'cancel' || a === 'save' || a === 'delete') { wpFormOpen = false; wpEditId = null; }
    const ac = document.getElementById('admin-content');
    if (ac) ac.innerHTML = adminContentHTML();
    return;
  }

  const navItem = e.target.closest('[data-admin-section]');
  if (navItem) {
    adminSection = navItem.dataset.adminSection;
    wpFormOpen = false;
    wpEditId = null;
    document.querySelectorAll('.admin-nav-item').forEach(i =>
      i.classList.toggle('active', i.dataset.adminSection === adminSection));
    const ac = document.getElementById('admin-content');
    if (ac) ac.innerHTML = adminContentHTML();
    return;
  }

  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const ctx = btn.dataset.ctx;
  const card = cards.find(c=>c.id===id);

  if ((action==='view full' || action==='view session' || action==='investigate') && card) { openFullWin(card); return; }
  if ((action==='ask CMO'||action==='record decision') && card) { openCMOFromCard(card, action); return; }
  if (action==='record outcome' && card) { openOutcomeFromCard(card); return; }
  if (action==='revise' && card) { openCMOFromCard(card, action); return; }
  if (action==='configure' && card) {
    card._done = true;
    if (ctx==='full') closeFullWin();
    setPage('admin');
    return;
  }
  if ((action==='approve' || action==='dismiss') && card) {
    card._done = true;
    if (ctx==='full') closeFullWin();
    setPage(activePage==='cmo' ? 'cmo' : 'stream');
    return;
  }
});

window.addEventListener('resize', () => {
  if (activePage==='cmo') setPage('cmo');
});

/* ── Council admin helpers ── */
function toggleIdeology(btn) {
  const area = btn.nextElementSibling;
  const open = btn.classList.contains('open');
  btn.classList.toggle('open', !open);
  area.classList.toggle('open', !open);
}

function toggleStatus(clickedBtn, seatId, mode) {
  const toggle = clickedBtn.parentElement;
  toggle.querySelectorAll('.stgl-btn').forEach(b => b.classList.remove('sel-vacant','sel-active'));
  clickedBtn.classList.add(mode === 'vacant' ? 'sel-vacant' : 'sel-active');
  const chip = document.getElementById('chip-' + seatId);
  if (chip) {
    chip.className = mode === 'active' ? 'chip-active' : 'chip-vacant';
    chip.textContent = mode === 'active' ? 'ACTIVE' : 'VACANT';
  }
}

function saveSeat(btn) {
  const orig = btn.textContent;
  btn.textContent = 'Saved ✓';
  btn.style.background = '#166534';
  setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1600);
}

/* ── Init ── */
setPage('stream');
</script>
