<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BOS — Council Prototype v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f5;--surface:#fff;--surface2:#fbfaf8;--border:#e5e3df;
  --text:#171717;--text2:#667085;--text3:#9ca3af;
  --green:#1a4731;--green-bg:#f0fdf4;--green-border:#bbf7d0;--green-mid:#166534;
  --amber:#d97706;--amber-bg:#fef3c7;--amber-border:#fde68a;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --purple:#6b21a8;--purple-bg:#faf5ff;--purple-border:#e9d5ff;
  --ok:#15803d;--ok-bg:#dcfce7;
  --ink:#0f0f0e;--ink2:#1b1917;--gold:#b45309;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}

/* Shell */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;max-width:1120px;width:100%;margin:0 auto;background:var(--bg)}
@media(min-width:1120px){.shell{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
.topbar{height:50px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 16px;flex-shrink:0;z-index:10}
.topbar-logo{font-size:13px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.07em}
.topbar-brand{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--green-bg);color:var(--green);font-weight:700;border:1px solid var(--green-border)}
.topbar-status{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--purple-bg);color:var(--purple);font-weight:700;border:1px solid var(--purple-border)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--text2);font-size:11px}
.page-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.page-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.page-scroll::-webkit-scrollbar{display:none}

/* Tabs */
.bottom-tabs{height:68px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 16px 8px;z-index:10}
.tab-group{display:inline-flex;align-items:stretch;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06)}
.tab-btn{display:flex;align-items:center;gap:8px;border:none;background:none;font-size:13px;font-weight:700;color:var(--text2);padding:9px 18px;border-radius:12px;transition:all .15s;white-space:nowrap}
.tab-btn:hover{color:var(--text);background:var(--bg)}
.tab-btn.active{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(26,71,49,.25)}
.tab-badge{background:var(--amber);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:12px;border:1px solid transparent;font-weight:600;transition:all .1s;background:transparent;color:var(--text2)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:var(--green-mid)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text2)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-accent{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.btn-warn{background:var(--amber-bg);border-color:var(--amber-border);color:#92400e}
.btn-dark{background:var(--ink);color:#f5f1e8;border-color:#2a2826}
.btn-send{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Shared cards */
.wrap{padding:20px 16px;max-width:520px;margin:0 auto}
.kicker{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-weight:700}
.title{font-size:21px;font-weight:800;margin-bottom:4px;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.45}
.notice{background:var(--purple-bg);border:1px solid var(--purple-border);border-radius:10px;padding:10px 12px;margin-bottom:14px;color:#4c1d95;font-size:12px;line-height:1.45}
.notice b{color:var(--purple)}
.obj-anchor{background:var(--surface);border:1px solid var(--green-border);border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.obj-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.obj-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--green)}
.obj-text{font-size:12px;color:var(--text);font-weight:600;line-height:1.35}
.obj-meta{font-size:10px;color:var(--text2);margin-left:auto;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:11px;transition:.12s ease}
.card.featured{border-color:var(--purple);border-left:3px solid var(--purple)}
.card:hover{box-shadow:0 8px 24px rgba(16,24,40,.07)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.type{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:5px}
.type.council{background:#1a0f00;color:#b45309;border:1px solid #2a1a08}
.type.decision{background:var(--amber-bg);color:#92400e}
.type.pending{background:var(--blue-bg);color:var(--blue)}
.type.outcome{background:var(--ok-bg);color:var(--ok)}
.type.blocker{background:var(--red-bg);color:var(--red)}
.type.memory{background:var(--green-bg);color:var(--green)}
.conf{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:auto;background:var(--purple-bg);color:var(--purple)}
.conf.amber{background:var(--amber-bg);color:#92400e}.conf.green{background:var(--ok-bg);color:var(--ok)}.conf.red{background:var(--red-bg);color:var(--red)}
.card-obj{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:2px}
.card-brand{font-size:10px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.card-why{font-size:13px;line-height:1.52;margin-bottom:10px}
.ev{margin-bottom:10px}.ev-item{font-size:11px;color:var(--text2);padding:2px 0;line-height:1.45}.ev-item::before{content:'· ';color:var(--text3)}
.rec{background:var(--green-bg);border:1px solid var(--green-border);border-radius:7px;padding:8px 10px;font-size:12px;color:var(--green-mid);line-height:1.45;margin-bottom:8px}.rec b{font-weight:800;margin-right:4px}
.boundary{font-size:11px;color:var(--text3);margin-bottom:8px;font-style:italic;line-height:1.4}
.src-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.src{font-size:10px;font-family:'SF Mono','Fira Mono',monospace;background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:4px;color:var(--text2)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* Council-specific */
.council-summary{background:#0f0f0e;color:#d8d3ca;border-radius:10px;padding:12px;margin-bottom:10px;font-family:'SF Mono','Fira Mono',monospace;border:1px solid #272523}
.cs-line{display:flex;gap:8px;font-size:11px;line-height:1.55;margin-bottom:5px}.cs-line:last-child{margin-bottom:0}.cs-k{color:#5c5a56;min-width:78px;text-transform:uppercase;font-size:9px;letter-spacing:.08em}.cs-v{color:#d8d3ca}
.vote-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}.vote{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 4px;text-align:center}.vote b{display:block;font-size:10px;color:var(--gold);font-family:'SF Mono','Fira Mono',monospace}.vote span{display:block;font-size:9px;color:var(--text2);margin-top:2px}.vote.warn{background:var(--amber-bg);border-color:var(--amber-border)}

/* CMO split */
.split-shell{display:flex;height:100%;overflow:hidden}.split-chat{flex:0 0 430px;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}.split-right{flex:1;overflow-y:auto;background:var(--surface);padding:20px;scrollbar-width:none}.split-right::-webkit-scrollbar{display:none}
@media(max-width:820px){.split-shell{flex-direction:column}.split-chat{flex:none;height:100%}.split-right{display:none}.tab-btn{padding:9px 13px}.topbar-status{display:none}}
.cmo-msgs{flex:1;overflow-y:auto;padding:16px;scrollbar-width:none}.cmo-msgs::-webkit-scrollbar{display:none}.cmo-msgs-body{display:flex;flex-direction:column;gap:14px}.cmo-ctx{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:4px}.msg-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:800}.msg-ai{background:var(--surface);border:1px solid var(--border);border-radius:10px;border-top-left-radius:2px;padding:10px 13px;font-size:13px;line-height:1.55;max-width:94%}.msg-user{background:var(--green);color:#fff;border-radius:10px;border-top-right-radius:2px;padding:9px 13px;font-size:13px;line-height:1.5;align-self:flex-end;max-width:86%}.cmo-input-wrap{flex-shrink:0;border-top:1px solid var(--border);padding:10px 16px}.cmo-composer{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px}.cmo-ta{width:100%;border:none;background:none;font-size:13px;resize:none;outline:none;color:var(--text)}.cmo-composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.cmo-hint{font-size:10px;color:var(--text3)}.chips{display:flex;gap:7px;flex-wrap:wrap}

.council-block{background:#0f0f0e;border:1px solid #272523;border-radius:0 10px 10px 10px;padding:14px 15px;font-family:'SF Mono','Fira Mono',monospace;font-size:11.5px;line-height:1.65;color:#c4c2bc;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.council-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#b45309;font-family:'SF Mono','Fira Mono',monospace;margin-bottom:5px}.council-hdr{color:#5c5a56;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #222220;padding-bottom:10px;margin-bottom:12px}.council-hdr strong{color:#8a8580}.round{color:#454340;font-size:9px;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 9px;display:flex;align-items:center;gap:8px}.round::after{content:'';flex:1;height:1px;background:#1e1c1a}.cpos{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start}.cpos-id{color:#b45309;font-weight:800;min-width:30px;flex-shrink:0;margin-top:1px}.cpos-body{flex:1;color:#c4c2bc}.reply{font-size:9.5px;color:#454340}.sig{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.07em;margin-top:4px;padding:1px 6px;border-radius:3px}.sig-aligned{color:#4ade80;background:rgba(74,222,128,.08)}.sig-dissent{color:#f87171;background:rgba(248,113,113,.08)}.sig-flag{color:#fbbf24;background:rgba(251,191,36,.08)}.inject{background:#161513;border:1px solid #2a2826;border-radius:6px;padding:9px 11px;margin:10px 0}.inject-label{color:#3e3c38;font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.inject-text{color:#9a9890;font-size:11.5px}.settled{background:#081510;border:1px solid #173d1e;border-radius:5px;padding:8px 10px;color:#4ade80;font-weight:800;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 13px}.section-lbl{color:#5c5a56;font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;margin-top:12px}.order{color:#e0deda;margin-bottom:4px;font-size:11.5px}.parked{margin-bottom:6px}.parked-tree{color:#7a7875;font-size:11.5px}.parked-tags{color:#454340;font-size:10.5px}

/* Right detail */
.rp-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}.rp-title{font-size:16px;font-weight:800}.rp-meta{font-size:11px;color:var(--text2);margin-top:3px}.rp-section{margin-bottom:16px}.rp-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:6px}.rp-body{font-size:13px;line-height:1.55;color:var(--text)}.rp-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}.decision-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px}.decision-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}.decision-row:last-child{border-bottom:none}.decision-k{font-size:10px;color:var(--text3);font-weight:800;text-transform:uppercase;letter-spacing:.06em;min-width:92px}.decision-v{font-size:12px;color:var(--text2);line-height:1.45}

/* Flow */
.flow-scroll{flex:1;overflow-y:auto;scrollbar-width:none}.flow-scroll::-webkit-scrollbar{display:none}.flow-col{max-width:560px;margin:0 auto;padding:24px 16px 32px}.flow-title{font-size:19px;font-weight:800;margin-bottom:4px}.flow-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.45}.flow-legend{display:flex;gap:14px;margin-bottom:24px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}.legend-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}.flow-node{display:flex}.flow-spine{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0}.flow-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px}.flow-dot.operator{background:var(--green)}.flow-dot.system{background:var(--text3)}.flow-dot.council{background:var(--gold)}.flow-line{width:2px;background:var(--border);flex:1;min-height:16px;margin:4px 0}.flow-body{flex:1;padding:0 0 24px 12px}.flow-node-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:5px;margin-top:3px}.flow-node-sub{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:8px}.flow-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.flow-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px}.tag-op{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}.tag-sys{background:var(--bg);color:var(--text2);border:1px solid var(--border)}.tag-council{background:#fff7ed;color:var(--gold);border:1px solid #fed7aa}.tag-state{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border)}.flow-io{font-size:11px;color:var(--text2);line-height:1.7;background:var(--bg);border-left:2px solid var(--border);padding:6px 10px;border-radius:0 4px 4px 0}.flow-io-key{color:var(--text3)}.flow-io-val{color:var(--text)}

/* Admin */
.admin-layout{display:flex;height:100%;overflow:hidden}.admin-nav{width:205px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);padding:20px 0;overflow-y:auto;scrollbar-width:none}.admin-nav::-webkit-scrollbar{display:none}.admin-nav-wordmark{font-size:12px;font-weight:800;color:var(--text);padding:0 16px 18px}.admin-nav-group{margin-bottom:6px;padding-bottom:12px;border-bottom:1px solid var(--border)}.admin-nav-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:8px 16px 4px}.admin-nav-item{display:block;width:100%;text-align:left;padding:7px 16px;font-size:13px;font-weight:600;color:var(--text2);background:none;border:none;border-left:2px solid transparent;line-height:1.3}.admin-nav-item:hover{color:var(--text);background:var(--bg)}.admin-nav-item.active{color:var(--green);background:var(--green-bg);border-left-color:var(--green);font-weight:800}.admin-content{flex:1;overflow-y:auto;scrollbar-width:none;padding:32px 36px}.admin-content::-webkit-scrollbar{display:none}.admin-section-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:4px}.admin-section-sub{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.5}.settings-group{margin-bottom:32px}.settings-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding-bottom:10px;border-bottom:1px solid var(--border)}.settings-row{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--border)}.settings-row-info{flex:1;min-width:0}.settings-row-name{font-size:13px;font-weight:800;color:var(--text);margin-bottom:2px}.settings-row-desc{font-size:12px;color:var(--text2);line-height:1.42}.settings-row-status{display:flex;align-items:center;gap:5px;white-space:nowrap}.s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.s-dot.green{background:var(--ok)}.s-dot.amber{background:var(--amber)}.s-dot.grey{background:var(--text3)}.s-text{font-size:12px;color:var(--text2)}.action-link{font-size:12px;color:var(--green);font-weight:700;background:none;border:none}.seat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}.seat-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}.seat-badge{font-size:11px;font-weight:800;font-family:'SF Mono','Fira Mono',monospace;background:#0f0f0e;color:#b45309;padding:3px 9px;border-radius:5px;border:1px solid #272523}.chip-active,.chip-locked{font-size:9.5px;font-weight:800;font-family:'SF Mono','Fira Mono',monospace;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.07em}.chip-active{background:var(--ok-bg);border:1px solid #86efac;color:var(--ok)}.chip-locked{background:var(--amber-bg);border:1px solid var(--amber-border);color:#92400e}.seat-desc{font-size:12px;color:var(--text2);line-height:1.45;margin-bottom:9px}.seat-field{margin-bottom:9px}.seat-field-lbl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);font-family:'SF Mono','Fira Mono',monospace;margin-bottom:4px;display:block}.seat-input,.seat-select,.seat-area{width:100%;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);outline:none}.seat-area{resize:vertical;min-height:62px;line-height:1.5;font-family:'SF Mono','Fira Mono',monospace}.rule-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}.rule-title{font-size:13px;font-weight:800;margin-bottom:8px}.rule-list{padding-left:18px;color:var(--text2);font-size:12px;line-height:1.65}
@media(max-width:900px){.admin-nav{display:none}.admin-content{padding:20px 16px}.vote-grid{grid-template-columns:repeat(2,1fr)}}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1a4731;color:#fff;font-size:13px;font-weight:700;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(26,71,49,.25);z-index:999;display:none}.toast.show{display:block;animation:pop .18s ease}@keyframes pop{from{opacity:.2;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <span class="topbar-logo">Klaroha</span>
    <span class="topbar-brand">Klaroha ↓</span>
    <span class="topbar-status">Council UX sample · post-Gate 2</span>
    <div class="topbar-right">May 20 · Council v2</div>
  </div>

  <div class="page-area"><div id="page-area" style="height:100%;overflow:hidden;display:flex;flex-direction:column"></div></div>

  <div class="bottom-tabs">
    <div class="tab-group">
      <button class="tab-btn active" data-page="stream">▶ Stream <span class="tab-badge">3</span></button>
      <button class="tab-btn" data-page="cmo">◎ CMO</button>
      <button class="tab-btn" data-page="admin">⚙ Admin</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">Saved.</div>

<script>
let activePage='stream';
let adminSection='policy';
let selectedMode='session';

const objective='Generate $40k pipeline from dormant prospects';
const councilQuestion='Scale the Gmail reactivation sequence to the remaining 32 contacts now, or refresh the list first?';

function streamCardHTML(kind){
  if(kind==='council') return `<div class="card featured">
    <div class="card-top"><span class="type council">Council Brief</span><span class="conf">Strategic complexity</span></div>
    <div class="card-obj">${objective}, Q2</div>
    <div class="card-brand">Klaroha · Gmail-only loop</div>
    <div class="card-why">BOS has a contested decision: the sequence is working, but the remaining list is stale. The question is not content quality — it is whether scaling now risks wasted sends and weak learning.</div>
    <div class="council-summary">
      <div class="cs-line"><span class="cs-k">Question</span><span class="cs-v">${councilQuestion}</span></div>
      <div class="cs-line"><span class="cs-k">Trigger</span><span class="cs-v">strategic_complexity · stale list + active revenue objective</span></div>
      <div class="cs-line"><span class="cs-k">Boundary</span><span class="cs-v">Council recommends only. Operator still decides.</span></div>
    </div>
    <div class="vote-grid">
      <div class="vote"><b>C1</b><span>scale batch</span></div>
      <div class="vote"><b>C2</b><span>refresh first</span></div>
      <div class="vote warn"><b>C3</b><span>revise proof</span></div>
      <div class="vote"><b>C4</b><span>split test</span></div>
      <div class="vote warn"><b>C5</b><span>challenge</span></div>
    </div>
    <div class="rec"><b>Next —</b>Open Council synthesis. If accepted, record decision + rationale into memory before BOS prepares the next Gmail artifact.</div>
    <div class="boundary">Gate note: Council is a post-Gate 2 design sample. It must not block the Gmail-only loop proof.</div>
    <div class="src-row"><span class="src">Memory — outcome + stale-list blocker</span><span class="src">No new connector</span><span class="src">No auto-execution</span></div>
    <div class="actions"><button class="btn btn-dark" onclick="setPage('cmo')">view council</button><button class="btn btn-accent" onclick="recordDecision()">record decision</button><button class="btn btn-ghost" onclick="toast('Deferred. PendingDecision would be created.')">defer</button></div>
  </div>`;
  if(kind==='decision') return `<div class="card">
    <div class="card-top"><span class="type decision">Decision Brief</span><span class="conf amber">Directional · 0.68</span></div>
    <div class="card-obj">${objective}, Q2</div><div class="card-brand">Klaroha</div>
    <div class="card-why">April memory supports case-study-led outreach. The risk is list freshness, not the email angle.</div>
    <div class="ev"><div class="ev-item">Case-study lead: 21% reply rate vs 8% feature-benefit.</div><div class="ev-item">Remaining 32 contacts have not been refreshed in 26 days.</div><div class="ev-item">Gmail is connected; list source is manual.</div></div>
    <div class="rec"><b>Next —</b>Approve 15-contact proof batch or refresh list before full scale.</div>
    <div class="boundary">BOS can prepare. BOS cannot send or scale without approval.</div>
    <div class="src-row"><span class="src">Gmail — live</span><span class="src">Memory — 2 outcomes</span></div>
    <div class="actions"><button class="btn btn-primary" onclick="toast('Approved proof batch. No full-scale send authorized.')">approve proof batch</button><button class="btn btn-ghost" onclick="setPage('cmo')">ask CMO</button></div>
  </div>`;
  return `<div class="card">
    <div class="card-top"><span class="type blocker">Setup Blocker</span><span class="conf green">Known</span></div>
    <div class="card-obj">${objective}, Q2</div><div class="card-brand">Klaroha</div>
    <div class="card-why">The remaining prospects came from a manual upload. BOS cannot verify who converted, opted out, or became disqualified.</div>
    <div class="ev"><div class="ev-item">List age: 26 days.</div><div class="ev-item">No CRM/list source configured.</div><div class="ev-item">Full-list scale is blocked; proof batch remains allowed.</div></div>
    <div class="rec"><b>Next —</b>Configure list source, or explicitly approve a smaller proof batch with rationale.</div>
    <div class="src-row"><span class="src">List source — requires setup</span></div>
    <div class="actions"><button class="btn btn-accent" onclick="adminSection='policy';setPage('admin')">configure policy</button><button class="btn btn-ghost" onclick="toast('Dismiss requires rationale for decision_not_to_act memory.')">dismiss</button></div>
  </div>`;
}

function renderStream(){return `<div class="page-scroll"><div class="wrap">
  <div class="kicker">Tuesday, May 20 · Klaroha</div>
  <div class="title">Council should clarify judgment, not add noise</div>
  <div class="sub">This sample shows the future Council behavior without violating Gate 2: Gmail-only, objective-scoped, recommendation-only, memory-writing after operator decision.</div>
  <div class="notice"><b>Scope guard:</b> Council is parked until the Gmail loop closes. This prototype defines the UX contract only.</div>
  <div class="obj-anchor"><div class="obj-dot"></div><div><div class="obj-label">Active Objective</div><div class="obj-text">${objective}</div></div><div class="obj-meta">Q2 · active</div></div>
  ${streamCardHTML('council')}${streamCardHTML('decision')}${streamCardHTML('blocker')}
</div></div>`}

function councilBlock(){return `<div style="width:100%"><div class="council-label">COUNCIL</div><div class="council-block">
  <div class="council-hdr"><strong>COUNCIL CONVENED</strong> · Klaroha · CS-GMAIL-002 · 5 seats · objective-scoped</div>
  <div class="round">Round 1 · Opening positions</div>
  <div class="cpos"><span class="cpos-id">S1</span><div class="cpos-body">The revenue objective favors action. Send a smaller proof batch now so we keep pipeline moving while list freshness is resolved.<br><span class="sig sig-aligned">SUPPORTS PROOF BATCH</span></div></div>
  <div class="cpos"><span class="cpos-id">A1</span><div class="cpos-body">Full scale is not justified. The stale list can contaminate outcome learning. I support only a 15-contact batch with clean tracking.<br><span class="sig sig-flag">FLAG: learning quality risk</span></div></div>
  <div class="cpos"><span class="cpos-id">C1</span><div class="cpos-body">The case-study angle is still the strongest creative. Do not rewrite the whole sequence; tighten the opener and preserve the proof frame.<br><span class="sig sig-aligned">KEEP ANGLE</span></div></div>
  <div class="cpos"><span class="cpos-id">G1</span><div class="cpos-body">Gmail can handle the proof batch. The remaining 32 should wait until the source is refreshed or explicitly approved despite risk.<br><span class="sig sig-aligned">GMAIL BOUNDARY CLEAR</span></div></div>
  <div class="cpos"><span class="cpos-id">D1</span><div class="cpos-body">Challenge: are we over-optimizing email timing when the real problem is list hygiene? Require a list-refresh task before any full-list recommendation appears again.<br><span class="sig sig-dissent">DISSENT ON FULL SCALE</span></div></div>
  <div class="inject"><div class="inject-label">Operator constraint</div><div class="inject-text">Gmail only. No second connector. Goal is to prove the objective loop, not expand channels.</div></div>
  <div class="round">Round 2 · Convergence</div>
  <div class="cpos"><span class="cpos-id">S1</span><div class="cpos-body"><span class="reply">↳ A1/D1 — </span>Accept the learning-quality constraint. Recommendation becomes: proof batch now, full scale blocked until list freshness is resolved.<br><span class="sig sig-aligned">ALIGNED</span></div></div>
  <div class="cpos"><span class="cpos-id">A1</span><div class="cpos-body">Aligned if the OutcomeRecord explicitly tags list freshness and batch size. Otherwise the next DecisionBrief will overgeneralize.<br><span class="sig sig-flag">FLAG: required memory tags</span></div></div>
  <div class="cpos"><span class="cpos-id">D1</span><div class="cpos-body">Dissent withdrawn if a PendingDecision is created for the remaining 32 contacts with waiting_for=list_refresh.<br><span class="sig sig-aligned">ALIGNED WITH CONDITION</span></div></div>
  <div class="settled">SETTLED · 2 rounds · 5/5 aligned · 1 pending decision</div>
  <div class="section-lbl">Marching orders</div>
  <div class="order">1. Approve 15-contact Gmail proof batch only.</div>
  <div class="order">2. Keep case-study angle; shorten opener; do not rewrite whole sequence.</div>
  <div class="order">3. Create PendingDecision for remaining 32 contacts: waiting_for=list_refresh.</div>
  <div class="order">4. OutcomeRecord must include batch_size, list_freshness, reply_quality, booked_calls.</div>
  <div class="order">5. Next DecisionBrief must not recommend full scale until setup blocker resolves.</div>
  <div class="section-lbl" style="margin-top:14px">Forbidden outcomes</div>
  <div class="parked"><div class="parked-tree">— Do not add another connector to solve this decision.</div><div class="parked-tags">reason: violates Gate 2 Gmail-only proof</div></div>
  <div class="parked"><div class="parked-tree">— Do not auto-send the remaining 32 contacts.</div><div class="parked-tags">reason: approval + list freshness boundary</div></div>
</div></div>`}

function renderCMO(){const chat=`<div class="split-chat"><div class="cmo-msgs"><div class="cmo-msgs-body">
  <div class="cmo-ctx"><span class="src">Klaroha</span><span class="src">${objective}</span><span class="src">council_brief</span><span class="src">post-Gate 2 sample</span></div>
  <div><div class="msg-label">CMO · loaded from Stream</div><div class="msg-ai">The council is only useful if it compresses disagreement into a decision you can make.<br><br>Here, it settled on a proof batch now and a blocked full-scale send until list freshness is resolved.</div></div>
  <div class="msg-user">@council ${councilQuestion}</div>
  ${councilBlock()}
  <div class="chips"><button class="btn btn-ghost" onclick="chip('why')">Why council?</button><button class="btn btn-ghost" onclick="chip('memory')">What writes to memory?</button><button class="btn btn-ghost" onclick="recordDecision()">Record decision</button><button class="btn btn-ghost" onclick="chip('handoff')">Handoff summary</button></div>
  <div id="chip-reply"></div>
</div></div><div class="cmo-input-wrap"><div class="cmo-composer"><textarea class="cmo-ta" rows="2" placeholder="Ask about this council decision..."></textarea><div class="cmo-composer-foot"><span class="cmo-hint">Council recommends. Operator decides.</span><button class="btn-send">↑</button></div></div></div></div>`;
const right=`<div class="split-right"><div class="rp-header"><div><div class="rp-title">Council Decision Packet</div><div class="rp-meta">Klaroha · ${objective}</div></div><button class="btn btn-warn">Design sample</button></div>
  <div class="rp-section"><div class="rp-label">Question</div><div class="rp-body" style="font-style:italic">"${councilQuestion}"</div></div>
  <div class="rp-section"><div class="rp-label">Decision-ready synthesis</div><div class="decision-box">
    <div class="decision-row"><div class="decision-k">Recommend</div><div class="decision-v">Approve a 15-contact proof batch now.</div></div>
    <div class="decision-row"><div class="decision-k">Block</div><div class="decision-v">Do not scale remaining 32 contacts until list freshness is resolved.</div></div>
    <div class="decision-row"><div class="decision-k">Why</div><div class="decision-v">Case-study creative has evidence; list freshness does not.</div></div>
    <div class="decision-row"><div class="decision-k">Memory tags</div><div class="decision-v">outcome · commitment · objection · tracking · list_freshness</div></div>
    <div class="decision-row"><div class="decision-k">Pending</div><div class="decision-v">remaining 32 contacts · waiting_for=list_refresh · action_blocked=full_scale_send</div></div>
  </div></div>
  <div class="rp-section"><div class="rp-label">Allowed</div><div class="rp-body">Record decision, create PendingDecision, prepare revised proof-batch artifact, write rationale memory.</div></div>
  <div class="rp-section"><div class="rp-label">Forbidden</div><div class="rp-body">No auto-send, no second connector, no platform expansion, no hidden execution from council output.</div></div>
  <div class="rp-actions"><button class="btn btn-primary" onclick="recordDecision()">Record decision + rationale</button><button class="btn btn-ghost" onclick="toast('PendingDecision created for remaining 32 contacts.')">Create PendingDecision</button><button class="btn btn-ghost" onclick="adminSection='flow';setPage('admin')">View flow in Admin</button></div>
</div>`;return `<div class="split-shell">${chat}${right}</div>`}

function renderFlow(){const steps=[
  ['system','Stream surfaces council trigger','A strategic decision has conflicting valid arguments: move pipeline now vs protect learning quality.','council_brief card created; no execution yet.'],
  ['operator','Operator opens CMO','CMO loads objective, selected card, MemoryEvents, OutcomeRecords, setup blocker, and approval boundaries.','Not a blank chat.'],
  ['council','Council deliberates','Five perspectives produce disagreement, constraints, synthesis, marching orders, and forbidden outcomes.','Recommendation only.'],
  ['operator','Operator decides','Operator accepts proof-batch recommendation or defers with rationale.','Human judgment remains the gate.'],
  ['system','Memory writes','BOS writes decision_made or decision_not_to_act with rationale; creates PendingDecision if deferred.','MemoryEvent + PendingDecision.'],
  ['system','Stream updates','A new decision_brief or pending_artifact appears. The next recommendation is better because the disagreement was captured.','No connector expansion.']
];const nodes=steps.map((s,i)=>{const role=s[0];const last=i===steps.length-1;const dot=role==='operator'?'O':role==='council'?'C':'S';const tag=role==='operator'?'tag-op':role==='council'?'tag-council':'tag-sys';return `<div class="flow-node"><div class="flow-spine"><div class="flow-dot ${role}">${dot}</div>${last?'':'<div class="flow-line"></div>'}</div><div class="flow-body"><div class="flow-node-title">${s[1]}</div><div class="flow-node-sub">${s[2]}</div><div class="flow-tags"><span class="flow-tag ${tag}">${role}</span><span class="flow-tag tag-state">${s[3]}</span></div><div class="flow-io"><span class="flow-io-key">contract: </span><span class="flow-io-val">Council clarifies judgment. It never executes actions directly.</span></div></div></div>`}).join('');return `<div class="flow-scroll"><div class="flow-col"><div class="flow-title">Council interaction path</div><div class="flow-sub">The Council is a deliberation protocol layered on top of Stream/CMO/Memory. It should resolve ambiguity into a human decision, not become a second operating surface.</div><div class="flow-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--green)">O</div> Operator</div><div class="legend-item"><div class="legend-dot" style="background:var(--text3)">S</div> System</div><div class="legend-item"><div class="legend-dot" style="background:var(--gold)">C</div> Council</div></div>${nodes}</div></div>`}

function adminNav(){const sections=[['policy','Trigger Policy'],['seats','Council Seats'],['guardrails','Guardrails'],['memory','Memory Contract'],['flow','Flow']];return `<div class="admin-nav"><div class="admin-nav-wordmark">BOS Admin</div><div class="admin-nav-group"><div class="admin-nav-label">Council</div>${sections.map(([s,l])=>`<button class="admin-nav-item${adminSection===s?' active':''}" data-admin-section="${s}">${l}</button>`).join('')}</div><div class="admin-nav-group"><div class="admin-nav-label">Gate note</div><button class="admin-nav-item" onclick="toast('Council stays parked until Gate 2 Gmail loop passes.')">Parked until Gate 2 passes</button></div></div>`}
function adminContent(){if(adminSection==='policy')return `<div class="admin-section-title">Trigger Policy</div><div class="admin-section-sub">Council should be rare. It appears only when normal CMO judgment is insufficient or a decision keeps being deferred.</div><div class="settings-group"><div class="settings-group-label">Allowed triggers</div>${row('Strategic complexity','Two or more valid paths with material business risk','green','Enabled')}${row('Persistent dismissal','Same topic dismissed twice without rationale','green','Enabled')}${row('Simple artifact approval','Normal approve/revise/dismiss flow','grey','Forbidden')}${row('Capability question','User asks what BOS can do','grey','Forbidden')}</div>`;
if(adminSection==='seats')return `<div class="admin-section-title">Council Seats</div><div class="admin-section-sub">Seats are roles, not a product-facing org chart. The operator sees synthesis first; transcript is inspectable when needed.</div>${seat('S1','Strategist','Revenue movement, objective fit, market timing','active')}${seat('A1','Analyst','Evidence quality, confidence, do-not list, measurement caveats','active')}${seat('C1','Creative','Message quality, proof angle, audience response','active')}${seat('G1','Gmail Specialist','Gmail execution boundary, deliverability, reply handling','active')}${seat('D1',"Devil's Advocate",'Challenges premise; protects against overconfident action','active')}`;
if(adminSection==='guardrails')return `<div class="admin-section-title">Guardrails</div><div class="admin-section-sub">Council output must include both allowed and forbidden outcomes.</div><div class="rule-box"><div class="rule-title">Allowed</div><ul class="rule-list"><li>Recommend next action.</li><li>State disagreement and confidence.</li><li>Create PendingDecision after operator choice.</li><li>Write rationale memory after explicit decision.</li></ul></div><div class="rule-box"><div class="rule-title">Forbidden</div><ul class="rule-list"><li>No direct send, spend, publish, or external action.</li><li>No second connector as an escape hatch for Gate 2.</li><li>No hidden RUN dispatch from council synthesis.</li><li>No replacing Stream with a council dashboard.</li></ul></div>`;
if(adminSection==='memory')return `<div class="admin-section-title">Memory Contract</div><div class="admin-section-sub">Council is valuable only if its reasoning becomes future context.</div><div class="settings-group"><div class="settings-group-label">Writes after operator decision</div>${row('MemoryEvent: decision_made','rationale required · topic_tags=outcome, commitment, list_freshness','green','Required')}${row('PendingDecision','remaining 32 contacts · waiting_for=list_refresh · action_blocked=full_scale_send','green','Required')}${row('OutcomeRecord fields','batch_size, reply_quality, booked_calls, pipeline_stage, confidence_source','green','Required')}${row('Passive transcript dump','Raw council transcript without synthesis or tags','grey','Forbidden')}</div>`;
if(adminSection==='flow')return `<div class="admin-section-title">Flow</div><div class="admin-section-sub">Council interaction path lives in Admin as an investigation/configuration reference, not as a primary operator tab.</div>${flowNodes()}`;
return ''}
function row(name,desc,dot,status){return `<div class="settings-row"><div class="settings-row-info"><div class="settings-row-name">${name}</div><div class="settings-row-desc">${desc}</div></div><div class="settings-row-status"><div class="s-dot ${dot}"></div><span class="s-text">${status}</span></div></div>`}
function seat(id,name,desc,status){return `<div class="seat-card"><div class="seat-card-hdr"><span class="seat-badge">${id}</span><span class="chip-active">${status}</span></div><div class="seat-desc"><b>${name}</b> — ${desc}</div><div class="seat-field"><span class="seat-field-lbl">Model slot</span><select class="seat-select"><option>deployment default</option><option>high-reasoning model</option><option>low-cost model</option></select></div><div class="seat-field"><span class="seat-field-lbl">Operating ideology</span><textarea class="seat-area">${desc}. Must cite evidence and state what would change its mind.</textarea></div></div>`}
function flowNodes(){const steps=[
  ['system','Stream surfaces council trigger','A strategic decision has conflicting valid arguments: move pipeline now vs protect learning quality.','council_brief card created; no execution yet.'],
  ['operator','Operator opens CMO','CMO loads objective, selected card, MemoryEvents, OutcomeRecords, setup blocker, and approval boundaries.','Not a blank chat.'],
  ['council','Council deliberates','Five perspectives produce disagreement, constraints, synthesis, marching orders, and forbidden outcomes.','Recommendation only.'],
  ['operator','Operator decides','Operator accepts proof-batch recommendation or defers with rationale.','Human judgment remains the gate.'],
  ['system','Memory writes','BOS writes decision_made or decision_not_to_act with rationale; creates PendingDecision if deferred.','MemoryEvent + PendingDecision.'],
  ['system','Stream updates','A new decision_brief or pending_artifact appears. The next recommendation is better because the disagreement was captured.','No connector expansion.']
];const nodes=steps.map((s,i)=>{const role=s[0];const last=i===steps.length-1;const dot=role==='operator'?'O':role==='council'?'C':'S';const tag=role==='operator'?'tag-op':role==='council'?'tag-council':'tag-sys';return `<div class="flow-node"><div class="flow-spine"><div class="flow-dot ${role}">${dot}</div>${last?'':'<div class="flow-line"></div>'}</div><div class="flow-body"><div class="flow-node-title">${s[1]}</div><div class="flow-node-sub">${s[2]}</div><div class="flow-tags"><span class="flow-tag ${tag}">${role}</span><span class="flow-tag tag-state">${s[3]}</span></div><div class="flow-io"><span class="flow-io-key">contract: </span><span class="flow-io-val">Council clarifies judgment. It never executes actions directly.</span></div></div></div>`}).join('');return `<div class="flow-legend"><div class="legend-item"><div class="legend-dot" style="background:var(--green)">O</div> Operator</div><div class="legend-item"><div class="legend-dot" style="background:var(--text3)">S</div> System</div><div class="legend-item"><div class="legend-dot" style="background:var(--gold)">C</div> Council</div></div>${nodes}`}
function renderAdmin(){return `<div class="admin-layout">${adminNav()}<div class="admin-content" id="admin-content">${adminContent()}</div></div>`}

function setPage(p){activePage=p;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const area=document.getElementById('page-area');if(p==='stream')area.innerHTML=renderStream();if(p==='cmo')area.innerHTML=renderCMO();if(p==='admin')area.innerHTML=renderAdmin()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function recordDecision(){toast('Decision recorded: proof batch approved; full scale blocked pending list refresh.');setTimeout(()=>toast('MemoryEvent + PendingDecision would be written.'),2200)}
function chip(kind){const replies={why:'Council is justified here because the recommendation has two competing risks: moving too slowly against the revenue objective, and scaling from stale list data that could corrupt learning.',memory:'Writes: decision_made rationale, PendingDecision for remaining contacts, and required OutcomeRecord tags so the next DecisionBrief knows why full scale was blocked.',handoff:'Handoff: objective active; Gmail proof batch recommended; remaining 32 blocked by list freshness; next action is approve proof batch or refresh list.'};const el=document.getElementById('chip-reply');if(el)el.innerHTML=`<div><div class="msg-label" style="margin-top:8px">CMO</div><div class="msg-ai">${replies[kind]}</div></div>`}

document.addEventListener('click',e=>{const tab=e.target.closest('.tab-btn[data-page]');if(tab){setPage(tab.dataset.page);return}const nav=e.target.closest('[data-admin-section]');if(nav){adminSection=nav.dataset.adminSection;document.querySelectorAll('.admin-nav-item').forEach(i=>i.classList.toggle('active',i.dataset.adminSection===adminSection));const ac=document.getElementById('admin-content');if(ac)ac.innerHTML=adminContent();}});
window.addEventListener('resize',()=>{if(activePage==='cmo')setPage('cmo')});
setPage('stream');
</script>
</body>
</html>
