name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  # ── Tests + guardrails ────────────────────────────────────────────────────
  test:
    name: Test & lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bos_test
          POSTGRES_USER: bos
          POSTGRES_PASSWORD: bos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_test
          API_SECRET_KEY: ci-secret
          ENCRYPTION_KEY: ci-encryption-key-32-bytes-padded
        run: |
          cd api
          python -m pytest tests/ plugins/google-ads/tests/ -v

      - name: Guardrail — no direct _resolve_brief in chat.py dispatch paths
        run: |
          # _resolve_brief must only appear at import and inside _brand_scoped_brief (line ~189).
          # Any additional call site means brand isolation is broken.
          COUNT=$(grep -c "await _resolve_brief(" api/routers/chat.py || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: $COUNT direct _resolve_brief calls found in chat.py — only 1 allowed (inside _brand_scoped_brief)"
            grep -n "await _resolve_brief(" api/routers/chat.py
            exit 1
          fi

      - name: Guardrail — no raw character-limit slicing in plugin modules
        run: |
          # Plugin modules must use _clip() for length enforcement, not raw [:N] slicing.
          if grep -rn "\[:30\]\|\[:90\]" api/plugins/*/capabilities/ 2>/dev/null | grep "\.py:"; then
            echo "ERROR: Raw [:30] or [:90] slice found in plugin module — use _clip() instead"
            exit 1
          fi

      - name: TypeScript strict type check
        run: |
          cd web
          npm ci --silent
          npx tsc -b

  # ── Build & push images to GHCR ──────────────────────────────────────────
  build-and-push:
    name: Build & push images
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/itsborj/bos-api:sha-${{ github.sha }}
            ghcr.io/itsborj/bos-api:staging

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/itsborj/bos-web:sha-${{ github.sha }}
            ghcr.io/itsborj/bos-web:staging

      - name: Build and push relay image
        uses: docker/build-push-action@v5
        with:
          context: ./relay
          push: true
          tags: |
            ghcr.io/itsborj/bos-relay:sha-${{ github.sha }}
            ghcr.io/itsborj/bos-relay:staging

  # ── Deploy to staging ────────────────────────────────────────────────────
  # DISABLED — auto-deploy on staging branch push caused unfinished features to
  # go live on staging.klaroha.com without review. Staging deploys must be
  # triggered manually via deploy-staging.sh on the server.
  # DO NOT RE-ENABLE this job without an explicit team decision and a defined
  # "staging-ready" gate (e.g. a separate release branch or manual workflow_dispatch).
  #
  # deploy-staging:
  #   name: Deploy → staging
  #   needs: build-and-push
  #   if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
  #   ...removed...

  # ── Deploy to production ─────────────────────────────────────────────────
  deploy-production:
    name: Deploy → production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy to hq.klaroha.com
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_DEPLOY_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_PATH }}
            git pull origin main
            docker compose up --build -d
            docker compose exec -T api alembic upgrade head
            echo "Production deploy complete"
