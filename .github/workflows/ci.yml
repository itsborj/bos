name: CI

# ── Branch strategy ───────────────────────────────────────────────────────────
# localhost  →  staging branch  →  main branch
#                    ↓                   ↓
#           staging.klaroha.com    hq.klaroha.com  (production — live clients)
#
# Rules:
#   • staging branch: tests → build images → auto-deploy to staging.klaroha.com
#   • main branch:    tests only — NO auto-deploy to production
#   • Production deploy: manual workflow_dispatch only, after staging is verified

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_sha:
        description: 'Git SHA to deploy (leave blank for latest on target branch)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Tests + guardrails ────────────────────────────────────────────────────
  test:
    name: Test & lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bos_test
          POSTGRES_USER: bos
          POSTGRES_PASSWORD: bos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://bos:bos@localhost:5432/bos_test
          API_SECRET_KEY: ci-secret
          ENCRYPTION_KEY: ci-encryption-key-32-bytes-padded
        run: |
          cd api
          python -m pytest tests/ plugins/google-ads/tests/ -v

      - name: Guardrail — no direct _resolve_brief in chat.py dispatch paths
        run: |
          COUNT=$(grep -c "await _resolve_brief(" api/routers/chat.py || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: $COUNT direct _resolve_brief calls found in chat.py — only 1 allowed (inside _brand_scoped_brief)"
            grep -n "await _resolve_brief(" api/routers/chat.py
            exit 1
          fi

      - name: Guardrail — no raw character-limit slicing in plugin modules
        run: |
          if grep -rn "\[:30\]\|\[:90\]" api/plugins/*/capabilities/ 2>/dev/null | grep "\.py:"; then
            echo "ERROR: Raw [:30] or [:90] slice found in plugin module — use _clip() instead"
            exit 1
          fi

      - name: TypeScript strict type check
        run: |
          cd web
          npm ci --silent
          npx tsc -b

  # ── Build & push images to GHCR (staging branch only) ────────────────────
  build-and-push:
    name: Build & push images
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/itsborj/bos-api:sha-${{ github.sha }}
            ghcr.io/itsborj/bos-api:staging

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/itsborj/bos-web:sha-${{ github.sha }}
            ghcr.io/itsborj/bos-web:staging

      - name: Build and push relay image
        uses: docker/build-push-action@v5
        with:
          context: ./relay
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/itsborj/bos-relay:sha-${{ github.sha }}
            ghcr.io/itsborj/bos-relay:staging

  # ── Auto-deploy to staging after images are built ────────────────────────
  deploy-staging-auto:
    name: Deploy → staging.klaroha.com
    needs: build-and-push
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: SSH deploy to staging.klaroha.com
        uses: appleboy/ssh-action@v1
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_DEPLOY_KEY }}
          envs: STAGING_ENV_FILE,DEPLOY_SHA,GHCR_TOKEN
          script: |
            set -euo pipefail
            STAGING_PATH=${{ secrets.STAGING_PATH }}
            if [ ! -d "$STAGING_PATH/.git" ]; then
              echo "Repo missing — cloning fresh"
              rm -rf "$STAGING_PATH"
              git clone https://github.com/itsborj/bos.git "$STAGING_PATH"
            fi
            if [ -z "${STAGING_ENV_FILE:-}" ]; then
              echo "ERROR: STAGING_ENV_FILE secret is empty"
              exit 1
            fi
            for key in ENV_FILE API_SECRET_KEY ENCRYPTION_KEY DATABASE_URL FRONTEND_URL; do
              if ! printf '%s\\n' "$STAGING_ENV_FILE" | grep -q "^${key}="; then
                echo "ERROR: STAGING_ENV_FILE missing required key name: ${key}"
                exit 1
              fi
            done
            printf '%s' "$STAGING_ENV_FILE" > "$STAGING_PATH/.env.staging"
            cd "$STAGING_PATH"
            export BOS_DEPLOY_PATH="$STAGING_PATH"
            git fetch origin
            git reset --hard origin/staging
            DEPLOY_SHA="$DEPLOY_SHA" GHCR_TOKEN="$GHCR_TOKEN" bash deploy-staging.sh

  # ── Manual deploy — staging or production ────────────────────────────────
  # Triggered via: GitHub Actions UI → "Run workflow"
  # Use target=staging to re-deploy staging without a push.
  # Use target=production ONLY after staging has been verified.
  deploy-manual:
    name: Deploy → ${{ github.event.inputs.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: SSH deploy to staging.klaroha.com
        if: github.event.inputs.target == 'staging'
        uses: appleboy/ssh-action@v1
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          DEPLOY_SHA: ${{ github.event.inputs.deploy_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_DEPLOY_KEY }}
          envs: STAGING_ENV_FILE,DEPLOY_SHA,GHCR_TOKEN
          script: |
            set -euo pipefail
            STAGING_PATH=${{ secrets.STAGING_PATH }}
            if [ ! -d "$STAGING_PATH/.git" ]; then
              rm -rf "$STAGING_PATH"
              git clone https://github.com/itsborj/bos.git "$STAGING_PATH"
            fi
            if [ -z "${STAGING_ENV_FILE:-}" ]; then
              echo "ERROR: STAGING_ENV_FILE secret is empty"
              exit 1
            fi
            for key in ENV_FILE API_SECRET_KEY ENCRYPTION_KEY DATABASE_URL FRONTEND_URL; do
              if ! printf '%s\\n' "$STAGING_ENV_FILE" | grep -q "^${key}="; then
                echo "ERROR: STAGING_ENV_FILE missing required key name: ${key}"
                exit 1
              fi
            done
            printf '%s' "$STAGING_ENV_FILE" > "$STAGING_PATH/.env.staging"
            cd "$STAGING_PATH"
            export BOS_DEPLOY_PATH="$STAGING_PATH"
            git fetch origin
            git reset --hard origin/staging
            DEPLOY_SHA="$DEPLOY_SHA" GHCR_TOKEN="$GHCR_TOKEN" bash deploy-staging.sh

      - name: SSH deploy to hq.klaroha.com (production)
        if: github.event.inputs.target == 'production'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_DEPLOY_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ${{ secrets.PROD_PATH }}
            git fetch origin
            git reset --hard origin/main
            SHA=$(git rev-parse HEAD)
            export API_IMAGE="ghcr.io/itsborj/bos-api:sha-${SHA}"
            export WEB_IMAGE="ghcr.io/itsborj/bos-web:sha-${SHA}"
            export RELAY_IMAGE="ghcr.io/itsborj/bos-relay:sha-${SHA}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u itsborj --password-stdin
            docker compose pull api web relay
            docker compose stop
            docker compose rm -f
            docker compose up -d --no-build --force-recreate
            _HEALTH=$(curl -s http://127.0.0.1:8090/api/ || true)
            _UPTIME=$(echo "$_HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('uptime_seconds','?'))" 2>/dev/null || echo "?")
            _GITSHA=$(echo "$_HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('git_sha','missing'))" 2>/dev/null || echo "missing")
            echo "================================================"
            echo " Production deploy complete"
            echo " image:          ghcr.io/itsborj/bos-api:sha-${SHA}"
            echo " git_sha:        ${_GITSHA}"
            echo " uptime_seconds: ${_UPTIME}s"
            echo "================================================"
