[project]
name = "klaroha-sdk"
version = "1.0.0"
description = "Klaroha BOS plugin SDK — stable interface for external channel plugins"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["klaroha_sdk*"]
