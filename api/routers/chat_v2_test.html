<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMO v2 — native tool calls test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #111; border-bottom: 1px solid #222; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #header h1 { font-size: 13px; color: #aaa; font-weight: normal; }
  #header .badge { background: #1a1a2e; color: #6688ff; border: 1px solid #334; padding: 2px 8px; border-radius: 3px; font-size: 11px; }
  #config { background: #111; border-bottom: 1px solid #222; padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #config input, #config select { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 4px 8px; font-family: monospace; font-size: 12px; }
  #config label { font-size: 11px; color: #666; white-space: nowrap; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 820px; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .user .bubble { background: #1a2a1a; border: 1px solid #2a4a2a; color: #d0f0d0; }
  .assistant .bubble { background: #1a1a2e; border: 1px solid #2a2a4e; color: #d0d0f0; }
  .tool-panel { background: #111; border: 1px solid #333; border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .tool-header { background: #1a1a1a; padding: 6px 12px; font-size: 11px; color: #888; display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .tool-header:hover { background: #222; }
  .tool-header .tool-name { color: #66aaff; font-weight: bold; }
  .tool-header .tool-status { color: #44dd88; }
  .tool-header .tool-status.failed { color: #ff6666; }
  .tool-header .tool-latency { color: #666; margin-left: auto; }
  .tool-body { display: none; padding: 10px 12px; font-size: 12px; }
  .tool-body.open { display: block; }
  .tool-summary { color: #aaa; margin-bottom: 6px; }
  .tool-input { color: #555; font-size: 11px; max-height: 100px; overflow-y: auto; background: #0d0d0d; padding: 6px 10px; border-radius: 3px; border-left: 2px solid #333; }
  .gen-image { margin-top: 8px; }
  .gen-image img { max-width: 320px; border: 1px solid #333; border-radius: 3px; display: block; }
  .meta { font-size: 10px; color: #555; margin-top: 4px; }
  #input-area { background: #111; border-top: 1px solid #222; padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; }
  #input-area textarea { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 8px 10px; font-family: monospace; font-size: 13px; resize: none; min-height: 40px; max-height: 120px; border-radius: 3px; }
  #input-area textarea:focus { outline: none; border-color: #4466aa; }
  #send-btn { background: #2a3a6a; color: #aaccff; border: 1px solid #3a5a9a; padding: 8px 16px; font-family: monospace; font-size: 12px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
  #send-btn:hover { background: #3a4a7a; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 11px; color: #666; padding: 4px 0; }
  .error-msg { color: #ff8888; font-size: 12px; padding: 6px 10px; background: #1a0a0a; border: 1px solid #441111; border-radius: 3px; }
  #clear-btn { background: none; border: 1px solid #333; color: #555; padding: 4px 10px; font-family: monospace; font-size: 11px; cursor: pointer; border-radius: 3px; }
  #clear-btn:hover { color: #888; border-color: #555; }
  #attach-btn, #drive-btn { background: none; border: 1px solid #333; color: #555; padding: 8px 10px; font-family: monospace; font-size: 12px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
  #attach-btn:hover, #drive-btn:hover { color: #aaa; border-color: #555; }
  #attach-btn.has-files { color: #66aaff; border-color: #4466aa; }
  #drive-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .attach-preview { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 16px; background: #0d0d0d; border-top: 1px solid #1a1a1a; }
  .attach-chip { display: flex; align-items: center; gap: 4px; background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 3px; padding: 2px 6px; font-size: 10px; color: #aaccff; }
  .attach-chip button { background: none; border: none; color: #666; cursor: pointer; font-size: 12px; padding: 0 2px; }
  .attach-chip button:hover { color: #ff6666; }
  .drive-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .drive-modal-inner { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; width: 560px; max-width: 95vw; max-height: 80vh; display: flex; flex-direction: column; gap: 10px; }
  .drive-modal-header { display: flex; justify-content: space-between; align-items: center; }
  .drive-modal-header h3 { font-size: 13px; color: #aaa; font-weight: normal; margin: 0; }
  .drive-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow-y: auto; max-height: 50vh; }
  .drive-grid-item { aspect-ratio: 1; border: 2px solid #222; border-radius: 4px; cursor: pointer; overflow: hidden; position: relative; }
  .drive-grid-item:hover { border-color: #4466aa; }
  .drive-grid-item.selected { border-color: #66aaff; box-shadow: 0 0 8px rgba(100,150,255,0.3); }
  .drive-grid-item img { width: 100%; height: 100%; object-fit: cover; }
  .drive-grid-item .name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); font-size: 9px; padding: 2px 4px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drive-grid-item .check { position: absolute; top: 4px; right: 4px; background: #66aaff; color: #000; border-radius: 50%; width: 16px; height: 16px; display: none; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
  .drive-grid-item.selected .check { display: flex; }
  .drive-loading { text-align: center; color: #666; padding: 20px; }
</style>
</head>
<body>
<div id="header">
  <h1>CMO v2 — native tool calls</h1>
  <span class="badge">loop</span>
  <span class="badge">lean</span>
  <button id="clear-btn" onclick="clearChat()">clear</button>
</div>
<div id="config">
  <label>Brand</label>
  <select id="brand-id" style="max-width:200px;">
    <option value="">auto-detect</option>
  </select>
  <label style="margin-left:8px;">Campaign ID</label>
  <input id="campaign-id" type="text" placeholder="paste campaign UUID (optional)" style="max-width:280px;">
  <label style="margin-left:8px;">Conv ID</label>
  <input id="conversation-id" type="text" placeholder="conversation UUID (optional)" style="max-width:200px;">
  <label style="margin-left:8px;">Mode</label>
  <select id="stream-mode">
    <option value="0">non-streaming</option>
    <option value="1" selected>streaming</option>
  </select>
</div>
<div id="messages"></div>
<div id="input-area">
  <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
  <button id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach images">📎</button>
  <button id="drive-btn" onclick="openDrivePicker()" title="Browse Google Drive">🗂️</button>
  <textarea id="msg-input" placeholder="Type a message…" rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
  <button id="send-btn" onclick="send()">Send</button>
</div>
<div class="attach-preview" id="attach-preview" style="display:none"></div>
<div class="drive-modal" id="drive-modal" style="display:none">
  <div class="drive-modal-inner">
    <div class="drive-modal-header">
      <h3 id="drive-path">Google Drive</h3>
      <button onclick="closeDrivePicker()" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px;">✕</button>
    </div>
    <div style="display:flex;gap:6px;">
      <input id="drive-search" type="text" placeholder="Search images…" style="flex:1;background:#111;border:1px solid #333;color:#e0e0e0;padding:4px 8px;font-family:monospace;font-size:11px;border-radius:3px;" oninput="filterDriveGrid()">
    </div>
    <div class="drive-grid" id="drive-grid"><div class="drive-loading">Loading…</div></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button onclick="closeDrivePicker()" style="background:#222;border:1px solid #333;color:#888;padding:6px 12px;border-radius:3px;cursor:pointer;">Cancel</button>
      <button id="drive-add-btn" onclick="addDriveSelection()" style="background:#2a3a6a;border:1px solid #3a5a9a;color:#aaccff;padding:6px 12px;border-radius:3px;cursor:pointer;" disabled>Add selected</button>
    </div>
  </div>
</div>
<script>
const API_BASE = '/api/cmo_v2';
let history = [];
let sending = false;
let attachedFiles = [];

function getApiKey() { return 'change-me-before-deploying'; }
function getBrandId() { return document.getElementById('brand-id').value || null; }
function getCampaignId() { return document.getElementById('campaign-id').value.trim() || null; }
function getConversationId() { return document.getElementById('conversation-id').value.trim() || null; }

function clearChat() {
  history = [];
  attachedFiles = [];
  renderAttachPreview();
  document.getElementById('messages').innerHTML = '';
}

function addMessage(role, content) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  el.appendChild(bubble);
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth', block:'end'});
  return el;
}

function addStatus(text) {
  const el = document.createElement('div');
  el.className = 'status';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth', block:'end'});
  return el;
}

function addErrorMsg(text) {
  const el = document.createElement('div');
  el.className = 'error-msg';
  el.textContent = text;
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth', block:'end'});
}

function renderToolCall(tc) {
  const panel = document.createElement('div');
  panel.className = 'tool-panel';
  const header = document.createElement('div');
  header.className = 'tool-header';
  const statusClass = tc.status === 'succeeded' ? 'tool-status' : 'tool-status failed';
  header.innerHTML = `<span class="tool-name">${tc.tool}</span>
    <span class="${statusClass}">${tc.status}</span>
    <span class="tool-latency">${(tc.latency_ms/1000).toFixed(2)}s via ${tc.provider || '?'}</span>
    <span style="margin-left:8px;color:#555;">▼ details</span>`;
  const body = document.createElement('div');
  body.className = 'tool-body';
  header.onclick = () => body.classList.toggle('open');
  let bodyHtml = '';
  if (tc.summary) bodyHtml += `<div class="tool-summary">${tc.summary}</div>`;
  if (tc.input && Object.keys(tc.input).length) bodyHtml += `<div class="tool-input"><b style="color:#777;">input:</b> ${JSON.stringify(tc.input, null, 2)}</div>`;
  if (tc.error) bodyHtml += `<div style="color:#ff8888;margin-top:6px;">${tc.error}</div>`;
  if (tc.image_b64) bodyHtml += `<div class="gen-image"><img src="data:${tc.mime_type||'image/png'};base64,${tc.image_b64}"></div>`;
  body.innerHTML = bodyHtml;
  panel.appendChild(header);
  panel.appendChild(body);
  return panel;
}

async function handleFiles(files) {
  for (const file of files) {
    const b64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    attachedFiles.push({
      kind: 'image', source: 'inline', title: file.name,
      text: `data:${file.type};base64,${b64}`, mime_type: file.type,
    });
  }
  renderAttachPreview();
}

function removeAttached(idx) { attachedFiles.splice(idx, 1); renderAttachPreview(); }

function renderAttachPreview() {
  const preview = document.getElementById('attach-preview');
  const btn = document.getElementById('attach-btn');
  if (attachedFiles.length === 0) {
    preview.style.display = 'none'; preview.innerHTML = ''; btn.classList.remove('has-files');
    return;
  }
  btn.classList.add('has-files');
  preview.style.display = 'flex';
  preview.innerHTML = attachedFiles.map((f, i) =>
    `<span class="attach-chip">${f.source === 'google_drive' ? '🗂️' : '📷'} ${f.title} <button onclick="removeAttached(${i})">×</button></span>`
  ).join('');
}

// ── Google Drive picker ──────────────────────────────────────────────
let driveImages = [], driveSelected = new Set(), driveAllImages = [];

async function openDrivePicker() {
  const brandId = getBrandId();
  if (!brandId) { alert('Select a brand first to browse its Google Drive'); return; }
  document.getElementById('drive-modal').style.display = 'flex';
  document.getElementById('drive-grid').innerHTML = '<div class="drive-loading">Loading…</div>';
  document.getElementById('drive-search').value = '';
  driveImages = []; driveSelected = new Set();
  document.getElementById('drive-add-btn').disabled = true;

  try {
    const resp = await fetch(`/social/drive/images?brand_id=${encodeURIComponent(brandId)}`, {
      headers: { 'X-API-Key': getApiKey() }
    });
    if (resp.ok) {
      const data = await resp.json();
      driveAllImages = (data.files || []).filter(f => (f.mimeType || '').startsWith('image/'));
    }
    driveImages = driveAllImages.map(f => ({ ...f, _type: 'image' }));
    renderDriveGrid();
  } catch(e) {
    document.getElementById('drive-grid').innerHTML = '<div class="drive-loading" style="color:#ff8888;">Drive not connected</div>';
  }
}

function closeDrivePicker() { document.getElementById('drive-modal').style.display = 'none'; }

function filterDriveGrid() {
  const q = document.getElementById('drive-search').value.toLowerCase().trim();
  driveImages = !q ? driveAllImages.map(f => ({ ...f, _type: 'image' }))
    : driveAllImages.filter(f => (f.name || '').toLowerCase().includes(q)).map(f => ({ ...f, _type: 'image' }));
  renderDriveGrid();
}

function renderDriveGrid() {
  const grid = document.getElementById('drive-grid');
  if (driveImages.length === 0) { grid.innerHTML = '<div class="drive-loading">No images found</div>'; return; }
  grid.innerHTML = driveImages.map((f, i) => {
    const sel = driveSelected.has(i) ? ' selected' : '';
    const thumb = f.thumbnailLink ? `<img src="${f.thumbnailLink}" loading="lazy">`
      : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#444;font-size:24px;">📷</div>';
    return `<div class="drive-grid-item${sel}" onclick="toggleDriveItem(${i})">
      ${thumb}<div class="name">${f.name || 'unnamed'}</div><div class="check">✓</div></div>`;
  }).join('');
}

function toggleDriveItem(idx) {
  if (driveSelected.has(idx)) driveSelected.delete(idx); else driveSelected.add(idx);
  document.getElementById('drive-add-btn').disabled = driveSelected.size === 0;
  renderDriveGrid();
}

async function addDriveSelection() {
  for (const idx of driveSelected) {
    const f = driveImages[idx];
    attachedFiles.push({
      kind: 'image', source: 'google_drive', title: f.name || 'Drive image',
      drive_file_id: f.id, drive_file_name: f.name,
      mime_type: f.mimeType || 'image/jpeg', thumbnail_link: f.thumbnailLink || null,
    });
  }
  closeDrivePicker();
  renderAttachPreview();
}

async function send() {
  if (sending) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  addMessage('user', text);
  if (attachedFiles.length > 0) {
    const msgEl = document.getElementById('messages').lastChild;
    const imgs = attachedFiles.map(f =>
      f.source === 'google_drive' && f.thumbnail_link
        ? `<img src="${f.thumbnail_link}" style="max-width:120px;max-height:120px;border-radius:3px;margin-top:6px;display:block;" title="${f.title}">`
        : `<img src="${f.text || ''}" style="max-width:120px;max-height:120px;border-radius:3px;margin-top:6px;display:block;" title="${f.title}">`
    ).join('');
    msgEl.querySelector('.bubble').innerHTML += `<div style="margin-top:4px">${imgs}</div>`;
  }
  history.push({role: 'user', text});
  sending = true;
  document.getElementById('send-btn').disabled = true;
  const useStream = document.getElementById('stream-mode').value === '1';
  if (useStream) await sendStreaming(); else await sendNonStreaming();
  sending = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

async function sendNonStreaming() {
  const statusEl = addStatus('Thinking…');
  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': getApiKey()},
      body: JSON.stringify({
        message: document.getElementById('msg-input').value || history[history.length-1]?.text,
        history: history.slice(-16), brand_id: getBrandId(), campaign_id: getCampaignId(),
        references: attachedFiles,
      }),
    });
    statusEl.remove();
    if (!resp.ok) { addErrorMsg(`HTTP ${resp.status}: ${(await resp.text()).slice(0,200)}`); return; }
    const data = await resp.json();
    attachedFiles = []; renderAttachPreview();
    renderResponse(data);
  } catch(e) { statusEl.remove(); addErrorMsg(`Error: ${e.message}`); }
}

async function sendStreaming() {
  const msgEl = document.createElement('div');
  msgEl.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble'; bubble.textContent = '';
  msgEl.appendChild(bubble);
  document.getElementById('messages').appendChild(msgEl);
  let replyText = '', toolCalls = [], meta = null;
  try {
    const resp = await fetch(`${API_BASE}/chat/stream`, {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': getApiKey()},
      body: JSON.stringify({
        message: document.getElementById('msg-input').value || history[history.length-1]?.text,
        history: history.slice(-16), brand_id: getBrandId(), campaign_id: getCampaignId(),
        references: attachedFiles,
      }),
    });
    if (!resp.ok) { addErrorMsg(`HTTP ${resp.status}: ${(await resp.text()).slice(0,200)}`); return; }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    attachedFiles = []; renderAttachPreview();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const dataStr = line.slice(6);
        if (dataStr === '[DONE]') continue;
        try {
          const event = JSON.parse(dataStr);
          if (event.type === 'text_delta') { replyText += event.text; bubble.textContent = replyText; msgEl.scrollIntoView({behavior:'smooth', block:'end'}); }
          else if (event.type === 'done') { replyText = event.reply || replyText; bubble.textContent = replyText; toolCalls = event.tool_calls || []; meta = event; }
        } catch(e) {}
      }
    }
  } catch(e) { addErrorMsg(`Stream error: ${e.message}`); return; }
  for (const tc of toolCalls) msgEl.appendChild(renderToolCall(tc));
  if (meta) {
    const el = document.createElement('div');
    el.className = 'meta';
    el.textContent = `${meta.provider}/${(meta.model||'').split('/').pop()} · ${meta.latency_ms}ms · ${meta.steps} steps`;
    msgEl.appendChild(el);
  }
  history.push({role: 'assistant', text: replyText || '(no reply)'});
}

function renderResponse(data) {
  const msgEl = document.createElement('div');
  msgEl.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = data.reply || '(no reply)';
  msgEl.appendChild(bubble);
  for (const tc of (data.tool_calls || [])) msgEl.appendChild(renderToolCall(tc));
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `${data.provider}/${(data.model||'').split('/').pop()} · ${data.latency_ms}ms · ${data.steps} steps`;
  msgEl.appendChild(meta);
  document.getElementById('messages').appendChild(msgEl);
  msgEl.scrollIntoView({behavior:'smooth', block:'end'});
  history.push({role: 'assistant', text: data.reply || ''});
}

document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
