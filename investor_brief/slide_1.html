<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        .cover-slide {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, var(--ivory) 0%, var(--soft-ivory) 100%);
        }
        .cover-title {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 82px;
            font-weight: 700;
            color: var(--racing-green);
            margin-bottom: 20px;
        }
        .cover-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            color: var(--stone-deep);
            max-width: 700px;
            margin-bottom: 40px;
        }
        .cover-footer {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 18px;
            color: var(--warm-gold);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="cover-slide">
        <h1 class="cover-title">Klaroha</h1>
        <p class="cover-subtitle">Demand-Capture Infrastructure for Distributed Sales Organizations</p>
        <div class="cover-footer">Pre-Seed Round — May 2026</div>
    </div>
</body>
</html>
