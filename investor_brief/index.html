<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klaroha — Investor Presentation</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&family=Inter:wght@400;500&display=swap');
        
        :root {
            --ivory: #F5F1E8;
            --ivory-mid: #EDE5D8;
            --soft-ivory: #E6DED0;
            --obsidian: #080B0D;
            --racing-green: #0B3D2E;
            --racing-green-deep: #0A2820;
            --racing-green-mid: #0F5C3E;
            --active-green: #1F7A4D;
            --warm-gold: #826D40;
            --satin-bronze: #B08A57;
            --champagne: #D8BE8A;
            --muted-stone: #A59674;
            --stone-deep: #6A5848;
            --border-light: #E0DAD0;
            --carbon: #101417;
            --gunmetal: #171D20;
            --smoked-panel: #1F272B;
            --border-graphite: #2E383D;
            --warning-amber: #C58B3B;
            --oxblood: #7A2E2E;
            --transition-speed: 0.4s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--obsidian);
            color: var(--ivory);
            overflow: hidden;
        }
        
        #root {
            height: 100vh;
            width: 100vw;
        }
        
        .deck-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background-color: var(--ivory);
            color: var(--obsidian);
            position: relative;
        }
        
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--soft-ivory);
            z-index: 100;
        }
        
        .progress-bar-fill {
            height: 100%;
            background-color: var(--racing-green);
            transition: width var(--transition-speed) ease-out;
        }
        
        .slide-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        .slide-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: var(--ivory);
        }
        
        .nav-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .nav-btn {
            background: var(--obsidian);
            color: var(--ivory);
            border: none;
            padding: 12px 24px;
            font-family: 'Josefin Sans', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-btn:hover {
            background: var(--racing-green);
            transform: translateY(-2px);
        }
        
        .nav-btn:disabled {
            background: var(--muted-stone);
            cursor: not-allowed;
            transform: none;
        }
        
        .slide-counter {
            position: absolute;
            bottom: 30px;
            left: 30px;
            font-family: 'Josefin Sans', sans-serif;
            font-size: 14px;
            color: var(--muted-stone);
        }
        
        @media (max-width: 1024px) {
            .nav-controls { right: 20px; bottom: 20px; }
            .slide-counter { left: 20px; bottom: 20px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Map of all slides created
        const slides = [];
        for (let i = 1; i <= 82; i++) {
            slides.push(`slide_${i}.html`);
        }

        function App() {
            const [currentSlide, setCurrentSlide] = useState(0);

            const nextSlide = useCallback(() => {
                setCurrentSlide(prev => Math.min(prev + 1, slides.length - 1));
            }, []);

            const handlePrev = useCallback(() => {
                setCurrentSlide(prev => Math.max(prev - 1, 0));
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') nextSlide();
                    if (e.key === 'ArrowLeft') handlePrev();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [nextSlide, handlePrev]);

            return (
                <div className="deck-container">
                    <div className="progress-bar-container">
                        <div 
                            className="progress-bar-fill" 
                            style={{ width: `${((currentSlide + 1) / slides.length) * 100}%` }}
                        ></div>
                    </div>
                    
                    <div className="slide-wrapper">
                        <iframe 
                            id="slide-frame" 
                            src={slides[currentSlide]} 
                            className="slide-frame"
                        ></iframe>
                    </div>
                    
                    <div className="slide-counter">
                        Slide {currentSlide + 1} of {slides.length}
                    </div>
                    
                    <div className="nav-controls">
                        <button className="nav-btn" onClick={handlePrev} disabled={currentSlide === 0}>
                            ← <span>Back</span>
                        </button>
                        <button className="nav-btn" onClick={nextSlide} disabled={currentSlide === slides.length - 1}>
                            <span>Next</span> →
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
