name: bos

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bos}
      POSTGRES_USER: bos
      POSTGRES_PASSWORD: bos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bos -d ${DB_NAME:-bos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8090}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - relay

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  public:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-3000}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  redis_data:
