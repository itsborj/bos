events {
    worker_connections 1024;
}

http {
    upstream bos_api {
        server api:8000;
    }

    upstream bos_web {
        server web:80;
    }

    server {
        listen 80;
        server_name _;

        # API — strip /api prefix before forwarding
        location /api/ {
            proxy_pass http://bos_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # OAuth callbacks — direct to API (no prefix strip)
        location /social/ {
            proxy_pass http://bos_api/social/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Public calendar booking pages
        location /calendar/ {
            proxy_pass http://bos_api/calendar/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI docs (direct, no prefix strip)
        location /docs {
            proxy_pass http://bos_api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://bos_api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Web UI (Vite dev server + HMR WebSocket)
        location / {
            proxy_pass http://bos_web/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
