events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # RFC 9110: nginx blocks TRACE at the proxy layer before it reaches FastAPI.
        # error_page + named location is the only reliable way to inject Allow header:
        # `return 405 <body>` with an explicit body keeps the response inline so
        # add_header applies (bare `return 405` triggers the error-page handler again).
        error_page 405 @method_not_allowed;
        location @method_not_allowed {
            add_header Allow "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            return 405 "Method Not Allowed";
        }

        # Chat stream — SSE endpoints, must not be buffered
        location /api/chat/stream {
            set $api api:8000;
            rewrite ^/api/(.+)$ /$1 break;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /api/cmo_v2/chat/stream {
            set $api api:8000;
            rewrite ^/api/(.+)$ /$1 break;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # Onboarding LLM generation endpoints — may take up to several minutes
        location /api/onboarding/ {
            set $api api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
        }

        # API — strip /api prefix before forwarding. Some artifact revisions
        # (JSON-first storyboard image edits, video generation, Drive rehydration)
        # can take several minutes; keep this aligned with chat/stream timeouts.
        location /api/ {
            set $api api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
        }

        # Auth relay — Google OAuth central handler
        location /relay/ {
            set $relay relay:8100;
            proxy_pass http://$relay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OAuth callbacks — direct to API (no prefix strip)
        location /social/ {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Webhook receivers (ClickUp and future PM plugins)
        location /webhooks/ {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Public calendar booking pages
        location /calendar/ {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI docs (direct, no prefix strip)
        location /docs {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Web UI — static files only, no WebSocket
        location / {
            set $web web:80;
            proxy_pass http://$web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
