events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Chat stream — SSE endpoint, must not be buffered
        location /api/chat/stream {
            set $api api:8000;
            rewrite ^/api/(.+)$ /$1 break;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        # API — strip /api prefix before forwarding
        location /api/ {
            set $api api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Auth relay — Google OAuth central handler
        location /relay/ {
            set $relay relay:8100;
            proxy_pass http://$relay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OAuth callbacks — direct to API (no prefix strip)
        location /social/ {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Webhook receivers (ClickUp and future PM plugins)
        location /webhooks/ {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Public calendar booking pages
        location /calendar/ {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI docs (direct, no prefix strip)
        location /docs {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            set $api api:8000;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Web UI
        location / {
            set $web web:80;
            proxy_pass http://$web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
