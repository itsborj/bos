events {
    worker_connections 1024;
}

http {
    # klaroha.com — public marketing/investor pages (Docker public service on 3000)
    server {
        listen 80;
        server_name klaroha.com www.klaroha.com;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }

    # hq.klaroha.com — production stack (Docker nginx on 8090)
    server {
        listen 80;
        server_name hq.klaroha.com;

        location / {
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # staging.klaroha.com — staging stack (Docker nginx on 8091)
    server {
        listen 80;
        server_name staging.klaroha.com;

        location / {
            proxy_pass http://127.0.0.1:8091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # Default — reject unmatched hosts
    server {
        listen 80 default_server;
        return 444;
    }
}
