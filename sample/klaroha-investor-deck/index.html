<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Klaroha — Investor Deck · Pre-Seed 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #050708; overflow: hidden; font-family: 'JetBrains Mono', monospace; }

.deck {
  width: 100%; height: 100%;
  position: relative;
}

/* Slide iframe */
.slide-frame {
  position: absolute; inset: 0;
  border: none;
  display: none;
}
.slide-frame.active { display: block; }

/* Chrome — top bar */
.chrome-top {
  position: fixed; top: 0; left: 0; right: 0; height: 3px;
  background: #055C71; z-index: 100;
  pointer-events: none;
}

/* Chrome — bottom controls */
.chrome-bottom {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 44px; background: rgba(8,11,13,0.92);
  border-top: 1px solid #2E383D;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; z-index: 100;
  backdrop-filter: blur(8px);
  opacity: 0;
  transition: opacity 0.3s;
}
.chrome-bottom.visible { opacity: 1; }

.nav-btn {
  background: none; border: 1px solid #2E383D; color: #AFA89C;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 6px 16px; cursor: pointer; border-radius: 2px;
  transition: border-color 0.15s, color 0.15s;
}
.nav-btn:hover { border-color: #055C71; color: #F5F1E8; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

.counter {
  font-size: 11px; letter-spacing: 0.15em;
  color: #AFA89C;
}
.counter span { color: #F5F1E8; }

.slide-title {
  font-size: 11px; letter-spacing: 0.1em;
  color: #AFA89C; text-transform: uppercase;
  max-width: 400px; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Progress bar */
.progress {
  position: fixed; bottom: 44px; left: 0; right: 0;
  height: 2px; background: #2E383D; z-index: 101;
}
.progress-fill {
  height: 100%; background: #055C71;
  transition: width 0.3s ease;
}
</style>
</head>
<body>
<div class="chrome-top"></div>

<div class="deck" id="deck">
  <iframe class="slide-frame active" src="slide-01-cover.html"     data-title="Cover"                id="s1"></iframe>
  <iframe class="slide-frame"        src="slide-02-problem.html"   data-title="The Problem"          id="s2"></iframe>
  <iframe class="slide-frame"        src="slide-03-solution.html"  data-title="The Solution"         id="s3"></iframe>
  <iframe class="slide-frame"        src="slide-04-market.html"    data-title="Market Opportunity"   id="s4"></iframe>
  <iframe class="slide-frame"        src="slide-05-model.html"     data-title="Business Model"       id="s5"></iframe>
  <iframe class="slide-frame"        src="slide-06-gtm.html"       data-title="Go-to-Market"         id="s6"></iframe>
  <iframe class="slide-frame"        src="slide-07-traction.html"  data-title="Traction &amp; Stage" id="s7"></iframe>
  <iframe class="slide-frame"        src="slide-08-team.html"      data-title="The Team"             id="s8"></iframe>
  <iframe class="slide-frame"        src="slide-09-financials.html"data-title="Financials"           id="s9"></iframe>
  <iframe class="slide-frame"        src="slide-10-funds.html"     data-title="Use of Funds"         id="s10"></iframe>
  <iframe class="slide-frame"        src="slide-11-ownership.html" data-title="Ownership"            id="s11"></iframe>
  <iframe class="slide-frame"        src="slide-12-ask.html"       data-title="The Ask"              id="s12"></iframe>
</div>

<div class="progress"><div class="progress-fill" id="progress"></div></div>

<div class="chrome-bottom" id="chrome">
  <button class="nav-btn" id="prev" onclick="go(-1)">← Prev</button>
  <div class="slide-title" id="slide-title">Cover</div>
  <div class="counter"><span id="cur">1</span> / <span id="tot"></span></div>
  <button class="nav-btn" id="next" onclick="go(1)">Next →</button>
</div>

<script>
const frames = Array.from(document.querySelectorAll('.slide-frame'));
const total = frames.length;
let current = 0;

document.getElementById('tot').textContent = total;

function render() {
  frames.forEach((f, i) => f.classList.toggle('active', i === current));
  document.getElementById('cur').textContent = current + 1;
  document.getElementById('slide-title').textContent = frames[current].dataset.title;
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === total - 1;
  document.getElementById('progress').style.width = ((current + 1) / total * 100) + '%';
}

function go(dir) {
  const next = current + dir;
  if (next >= 0 && next < total) { current = next; render(); }
}

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')                     go(-1);
  if (e.key === 'Home') { current = 0; render(); }
  if (e.key === 'End')  { current = total - 1; render(); }
});

// Show chrome on mouse move, hide after 2s idle
let hideTimer;
document.addEventListener('mousemove', () => {
  document.getElementById('chrome').classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => document.getElementById('chrome').classList.remove('visible'), 2000);
});

render();
</script>
</body>
</html>
